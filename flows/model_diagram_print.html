<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Model diagram, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<style>
  /* 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: var(--s-2); }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .dd-footer { margin-top: var(--s-2); }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title">How the study's measures are calculated</h2>
  <p class="dd-subtitle">Each step's inputs, calculation and output; arrows show where one step feeds the next</p>
  <div id="d"></div>
  <figcaption class="dd-footer"><span class="dd-source">Coefficients from models fitted to Missouri, all 115 counties
    (St. Louis city and county as one), printed by analysis/travel_model.py, coverage_model.py and spillover_outlets.py.
    Visits: Advan Research, Neighborhood Patterns Plus (Dewey Data), January–September 2026 (areas: January–July).
    Stories: Missouri School of Journalism analysis, March 2026. Commuting: LODES 2023.</span></figcaption>
</figure>
<script src="d3.min.js"></script>
<script>
// Coefficients are those printed by analysis/travel_model.py, coverage_model.py and spillover_outlets.py.
const C = { ink: "#0b0b0b", mute: "#5b6370", line: "#898781", data: "#f4f4f1", dataEdge: "#c3c2b7",
            model: "#003a56", out: "#d3ecfa", outEdge: "#8db1c4", panel: "#fafaf8" };
const W = 528, svg = d3.select("#d").append("svg").attr("width", W);
const defs = svg.append("defs");
defs.append("marker").attr("id", "ah").attr("viewBox", "0 0 8 8").attr("refX", 7).attr("refY", 4)
  .attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto")
  .append("path").attr("d", "M0,0 L8,4 L0,8 z").attr("fill", C.line);

// a box: kind data | model | out; lines: [[text, weight]]
function box(x, y, w, h, kind, lines) {
  const fill = kind === "model" ? C.model : kind === "out" ? C.out : C.data;
  const edge = kind === "model" ? C.model : kind === "out" ? C.outEdge : C.dataEdge;
  const ink = kind === "model" ? "#ffffff" : C.ink;
  svg.append("rect").attr("x", x).attr("y", y).attr("width", w).attr("height", h).attr("rx", 4)
    .attr("fill", fill).attr("stroke", edge);
  const lh = 11.5, top = y + h / 2 - ((lines.length - 1) * lh) / 2 + 3.5;
  lines.forEach(([t, wt], i) => svg.append("text").attr("x", x + w / 2).attr("y", top + i * lh)
    .attr("text-anchor", "middle").attr("font-size", 9.5).attr("font-weight", wt || 400).attr("fill", ink).text(t));
  return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, r: x + w, b: y + h };
}
const arrow = (pts) => svg.append("path").attr("d", d3.line()(pts)).attr("fill", "none").attr("stroke", C.line)
  .attr("stroke-width", 1.2).attr("marker-end", "url(#ah)");
function panel(y, h, letter, title) {
  svg.append("rect").attr("x", 0).attr("y", y).attr("width", W).attr("height", h).attr("fill", C.panel)
    .attr("stroke", "#e1e0d9");
  svg.append("text").attr("x", 10).attr("y", y + 17).attr("font-size", 11.5).attr("font-weight", 650)
    .attr("fill", C.ink).text(`${letter}  ${title}`);
}
function formula(x, y, lines) {
  // style(), not attr(): the page's svg text rule would override a font-family attribute; pre keeps the indents
  lines.forEach((t, i) => svg.append("text").attr("x", x).attr("y", y + i * 13).attr("font-size", 9.5)
    .attr("fill", C.ink).style("font-family", "ui-monospace, SFMono-Regular, Menlo, monospace")
    .style("white-space", "pre").text(t));
}
function words(x, y, lines) {
  // an equation in words: first line bold, the factors indented beneath it
  lines.forEach((t, i) => svg.append("text").attr("x", x + (i ? 10 : 0)).attr("y", y + i * 13).attr("font-size", 9.8)
    .attr("font-weight", i ? 400 : 600).attr("fill", C.ink).text(t));
}
function note(x, y, lines) {
  lines.forEach((t, i) => svg.append("text").attr("x", x).attr("y", y + i * 12).attr("font-size", 9)
    .attr("fill", C.mute).text(t));
}

// ---- A: travel ----------------------------------------------------------------------------------------------------
let y0 = 4;
panel(y0, 232, "A", "Travel: where each county's residents go");
const a1 = box(10, y0 + 28, 118, 52, "data", [["Residents' visits", 600], ["home county i →", 400], ["county j, Jan–Sep", 400]]);
const a2 = box(142, y0 + 28, 110, 52, "data", [["Calibrate to", 600], ["population; remove", 400], ["excess highway stops", 400]]);
const a3 = box(266, y0 + 28, 118, 52, "model", [["Gravity model", 650], ["(Poisson, every", 400], ["county pair)", 400]]);
const a4 = box(398, y0 + 28, 120, 52, "out", [["Expected visits", 650], ["for every", 400], ["county pair", 400]]);
arrow([[a1.r, a1.cy], [a2.x - 2, a2.cy]]); arrow([[a2.r, a2.cy], [a3.x - 2, a3.cy]]); arrow([[a3.r, a3.cy], [a4.x - 2, a4.cy]]);
words(14, y0 + 102, [
  "Visits from county i to county j =",
  "how much county i's residents travel overall",
  "× how strongly county j draws visitors from everywhere (jobs, stores, hospitals, campus)",
  "× distance: around 25 miles, twice as far gets about half the visits from a metro county,",
  "   three-quarters from a rural one",
  "× 1.6 if the two counties share a border",
  "× more where workers commute between them, either way",
]);
note(14, y0 + 200, [
  "Each county's travel predicted without its own data: 94% of the variation in where residents go.",
  "Crossover = residents seen outside the county ÷ residents: Audrain 44%, Boone 26%, Osage 59%",
]);

// ---- B: coverage --------------------------------------------------------------------------------------------------
y0 = 244;
panel(y0, 204, "B", "Coverage: which counties each county's newsrooms cover");
const b1 = box(10, y0 + 34, 118, 52, "data", [["Stories by county i's", 600], ["newsrooms about", 400], ["county j, March", 400]]);
const b3 = box(266, y0 + 34, 118, 52, "model", [["Same gravity terms", 650], ["+ residents' visits", 400], ["i → j", 400]]);
const b4 = box(398, y0 + 34, 120, 52, "out", [["Expected stories", 650], ["about each", 400], ["other county", 400]]);
arrow([[b1.r, b1.cy], [b3.x - 2, b3.cy]]); arrow([[b3.r, b3.cy], [b4.x - 2, b4.cy]]);
// calibrated visits (A) feed the coverage model (B): under the boxes and down the right margin, clear of the text
arrow([[a2.cx, a2.b], [a2.cx, a2.b + 7], [W - 5, a2.b + 7], [W - 5, b3.y - 6], [b3.cx, b3.y - 6], [b3.cx, b3.y - 2]]);
words(14, y0 + 104, [
  "Stories by county i's newsrooms about county j =",
  "how much county i's newsrooms publish overall",
  "× how much county j is written about by newsrooms everywhere",
  "× the same distance, border and commuting effects as travel",
  "× residents' visits from i to j: twice the visits, 1.41 times the stories from",
  "   metro newsrooms, 1.20 times from rural ones",
]);
note(14, y0 + 190, [
  "A story counts once for each other county it is centred in or mentions",
]);

// ---- C: spillover -------------------------------------------------------------------------------------------------
y0 = 456;
panel(y0, 208, "C", "Spillover: how much of an outlet's news is about another county");
const c1 = box(10, y0 + 28, 118, 30, "data", [["Broadcaster?", 600]]);
const c2 = box(10, y0 + 66, 118, 40, "data", [["Print and digital", 600], ["outlets in county", 400]]);
const c3 = box(150, y0 + 36, 112, 58, "model", [["Logistic model", 650], ["fitted on 85 well-", 400], ["collected outlets", 400]]);
const c4 = box(284, y0 + 36, 100, 58, "out", [["Expected share", 650], ["for each", 400], ["outlet", 400]]);
const c5 = box(398, y0 + 36, 120, 58, "out", [["County expected", 650], ["outlets averaged,", 400], ["weighted by stories", 400]]);
arrow([[c1.r, c1.cy], [c3.x - 2, c3.y + 14]]); arrow([[c2.r, c2.cy], [c3.x - 2, c3.b - 14]]);
arrow([[c3.r, c3.cy], [c4.x - 2, c4.cy]]); arrow([[c4.r, c4.cy], [c5.x - 2, c5.cy]]);
words(14, y0 + 126, [
  "Share of an outlet's stories about other counties (expected):",
  "in a county with 2 print outlets: print 22%, broadcaster 36%",
  "in a county with 5 print outlets: print 18%, broadcaster 30%",
  "the more print outlets a county has, the more each one keeps to its own county",
]);
note(14, y0 + 186, [
  "A story centred in another county counts 1, a home story mentioning another county ½,",
  "a sports story half that",
]);

// ---- D: civic interest area ---------------------------------------------------------------------------------------
y0 = 672;
panel(y0, 258, "D", "Civic interest area: the places a town's residents share");
const q1 = box(10, y0 + 28, 92, 58, "data", [["Travel of each", 600], ["block group to", 400], ["each place", 400]]);
const q2 = box(112, y0 + 28, 92, 58, "model", [["Travel", 650], ["patterns", 650], ["(NMF)", 400]]);
const q3 = box(214, y0 + 28, 98, 58, "model", [["Tie to each", 650], ["3 km hexagon:", 400], ["travel × news", 400]]);
const q4 = box(322, y0 + 28, 92, 58, "model", [["1,728 ways", 650], ["of drawing", 400], ["the map", 400]]);
const q5 = box(424, y0 + 28, 94, 58, "out", [["Area: places", 650], ["likely 50%", 400], ["or more", 400]]);
[[q1, q2], [q2, q3], [q3, q4], [q4, q5]].forEach(([u, v]) => arrow([[u.r, u.cy], [v.x - 2, v.cy]]));
words(14, y0 + 108, [
  "Tie from a town to each place =",
  "the town's residents' travel there",
  "× up to 3 times more where news ties it: each town's news about the other (up to 0.3",
  "   each way) and places one town visits and the other covers (up to 0.7 each)",
]);
words(14, y0 + 170, [
  "Likelihood a place is in the area =",
  "how many of 1,728 reasonable ways of drawing the map include it",
]);
note(14, y0 + 212, [
  "Travel patterns: each must hold 10%+ and 1,000+ of some town's residents and 10%+ of",
  "its travel, and recur in odd and even months. Ways of drawing the map vary hexagon size,",
  "spread within places, smoothing, selectivity and reach. Area: every part of 3+ hexagons",
  "likely 50% or more",
]);
svg.attr("height", 934).attr("viewBox", [0, 0, W, 934]);
document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
document.body.dataset.ready = "1";
</script>
</body>
</html>
