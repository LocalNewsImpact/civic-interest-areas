<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Model diagram, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  /* 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; color: #0b0b0b; }
  body { width: 528px; font-size: 9.5px; line-height: 1.35; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: 6px; }
  .panel { background: #fafaf8; border: 1px solid #d9d8d0; padding: 7px 10px 8px; margin: 0 0 7px; }
  .panel h3 { font-size: 11.5px; font-weight: 650; margin: 0 0 4px; text-transform: none; letter-spacing: 0; }
  .lab { font-weight: 600; color: #003a56; }
  .sec { font-size: 9px; font-weight: 600; color: #5b6370; margin: 6px 0 2px; }
  .eq { margin: 2px 0 2px 4px; font-size: 10px; }
  .eq .katex { font-size: 1.02em; }
  .note { color: #5b6370; font-size: 8.8px; margin: 1px 0 0 4px; }
  table.key { border-collapse: collapse; width: 100%; font-size: 8.8px; }
  table.key td { padding: 1.5px 4px; vertical-align: top; border-top: 1px solid #ecebe5; }
  table.key td.s { width: 62px; white-space: nowrap; }
  table.key td.v { width: 92px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .out { margin-top: 5px; }
  /* print: each calculation stays on one page; US Letter with 0.5 in margins */
  @page { size: letter; margin: 0.5in; }
  .panel { break-inside: avoid; page-break-inside: avoid; }
  .dd-title, .dd-subtitle { break-after: avoid; page-break-after: avoid; }
  figcaption { break-inside: avoid; page-break-inside: avoid; }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title">How the study's measures are calculated</h2>
  <p class="dd-subtitle">For each measure: the question it answers, the calculation, its terms with fitted values, and
    its output</p>
  <div id="d"></div>
  <figcaption class="dd-footer"><span class="dd-source">Fitted values with standard errors in parentheses or 95% intervals
    in brackets, as printed by analysis/travel_model.py, build_unique_od.py, coverage_model.py and spillover_outlets.py,
    and flows/area_ensemble.py. Travel, coverage and spillover are fitted on all Missouri counties; results are reported
    for Audrain, Boone and Osage counties. Visits: Advan Research, Neighborhood Patterns Plus (Dewey Data),
    January–September 2026 (areas: January–July). Stories: Missouri School of Journalism analysis, March 2026.
    Commuting: LODES 2023.</span></figcaption>
</figure>
<script>
// Each panel: title, question, equations (TeX), estimation note, key rows [symbol (TeX), meaning, value], output.
const P = [
 { t: "A  Travel: where each county's residents go",
   q: "How many visits would residents of county i be expected to make to county j, given distance, a shared border and commuting?",
   eq: ["\\mathrm{E}[V_{ij}] = \\exp\\big(\\alpha_i + \\gamma_j + \\beta_1 D_{ij} + \\beta_2 D_{ij}^2 + R_i(\\beta_3 D_{ij} + \\beta_4 D_{ij}^2)",
        "\\qquad\\qquad + \\beta_5 P_i D_{ij} + \\beta_6 B_{ij} + \\beta_7 C_{ij} + \\beta_8 C_{ji}\\big)"],
   est: "Poisson pseudo-maximum likelihood (PPML) over all 13,110 ordered pairs of 115 counties, zero pairs kept; errors clustered by home and destination county (robust to overdispersion).",
   key: [["V_{ij}", "visits by residents of county i to county j, January–September 2026 (Advan), scaled to people; highway pass-through stops removed", ""],
         ["\\alpha_i,\\ \\gamma_j", "overall travel from county i; overall pull of county j (fixed effects, one per county)", "estimated"],
         ["D_{ij}", "ln(miles between 2020 population centres ÷ 25)", ""],
         ["R_i", "1 if county i is rural: under half its 2020 population in Census urban areas", ""],
         ["P_i", "ln population of county i, centred (ACS 2020–2024)", ""],
         ["B_{ij}", "1 if the counties share a border", ""],
         ["C_{ij}", "ln(1 + workers living in i who work in j per 1,000 workers living in i) (LODES)", ""],
         ["\\beta_1", "D: distance elasticity at 25 miles, urban home county", "−0.88 (0.13)"],
         ["\\beta_2", "D²", "−0.26 (0.03)"],
         ["\\beta_3", "R · D", "0.18 (0.12)"],
         ["\\beta_4", "R · D²", "−0.21 (0.05)"],
         ["\\beta_5", "P · D", "0.13 (0.03)"],
         ["\\beta_6", "B", "0.44 (0.07)"],
         ["\\beta_7", "C, commuting from i to j", "0.28 (0.05)"],
         ["\\beta_8", "C, commuting from j to i", "0.19 (0.04)"]],
   out: "Expected visits for every county pair. Each county predicted without its own data: R² 93.7% [92.4, 94.8], share-weighted error 3.28 points. Twice the distance at 25 miles: about 54% of the visits from an urban county, 62% from a rural one." },
 { t: "B  Crossover: how many of a county's residents go elsewhere",
   q: "What share of a county's residents is seen outside the county in a month?",
   eq: ["\\displaystyle \\text{crossover}_c = \\frac{\\sum_{h \\in c} \\min(L_h,\\, D_h)}{\\sum_{h \\in c} D_h}, \\qquad D_h = E_h^{\\,b}\\, S_h^{\\,1-b}"],
   est: "b estimated by two-stage least squares across months: a block group's log leaving rate on its log detection ratio d = S/E, instrumented by the same ratio in another month (one excluded instrument, just-identified; county-clustered first-stage F = 4,082).",
   key: [["L_h", "residents of home block group h seen in their single busiest block group outside the county (a lower bound on residents who left; Advan)", ""],
         ["S_h", "residents of h seen at home (Advan); inflated where homes are over-detected", ""],
         ["E_h", "ACS 2020–2024 population of h × the month's statewide phones per resident", ""],
         ["b", "share of the excess phones at home that behave like phantoms rather than residents", "0.62 [0.53, 0.71]"]],
   out: "Share of residents seen outside the county, January–September 2026: Audrain 44%, Boone 26%, Osage 59% (Osage 57–61% over b's interval)." },
 { t: "C  Coverage: which counties each county's newsrooms cover",
   q: "How many stories would county k's newsrooms be expected to write about county j, given geography and residents' travel there?",
   eq: ["\\mathrm{E}[S_{kj}] = \\exp\\big(\\nu_k + \\mu_j + \\boldsymbol{\\theta}^{\\top}\\mathbf{X}_{kj} + \\beta_1 \\ell_{kj} + \\beta_2 R_k \\ell_{kj} + \\beta_3 Z_{kj}\\big)",
        "\\ell_{kj} = \\begin{cases} \\ln V_{kj} & V_{kj} > 0 \\\\ 0 & V_{kj} = 0 \\end{cases}, \\qquad Z_{kj} = \\mathbf{1}[V_{kj} = 0]"],
   est: "PPML over every newsroom county k and other county j (zero pairs kept); errors clustered by newsroom county. Travel spans January–September 2026 and includes the month of the stories (March), so the model measures association, not the direction of influence between travel and coverage.",
   key: [["S_{kj}", "stories by newsrooms in county k centred in or naming county j, March 2026 (Missouri School of Journalism analysis)", ""],
         ["\\nu_k,\\ \\mu_j", "output of k's newsrooms; how much j is covered by newsrooms everywhere (fixed effects)", "estimated"],
         ["\\mathbf{X}_{kj}", "the distance, border and commuting terms of A", "estimated"],
         ["V_{kj}", "residents' visits from k to j (as in A)", ""],
         ["R_k", "1 if the newsroom county is rural (the flag R of A)", ""],
         ["Z_{kj}", "1 if no visit was recorded", ""],
         ["\\beta_1", "ℓ: elasticity of stories to visits, urban newsroom counties", "0.47 (0.069)"],
         ["\\beta_2", "R · ℓ: difference in elasticity, rural − urban", "−0.23 (0.047)"],
         ["\\beta_3", "Z", "estimated"]],
   out: "Expected stories. Twice the visits: 1.38 times the stories from urban newsrooms, 1.18 times from rural ones. Held-out error, destinations with 1%+ of visits: 4.54 [4.09, 5.04]." },
 { t: "D  Spillover: how much of an outlet's news is about another county",
   q: "What share of an outlet's stories would be expected to be about other counties?",
   eq: ["\\displaystyle \\mathrm{E}[y_o] = \\frac{1}{1 + e^{-z_o}}, \\qquad z_o = \\beta_0 + \\beta_1 T_o + \\beta_2 \\ln(1 + N_o)"],
   est: "Fractional logistic regression (Papke and Wooldridge); cluster-jackknife (CRV3) errors by county. Fitted on the 85 outlets in 48 counties that meet four criteria set before fitting: 20+ stories placed in a county; body text for 95%+ of local stories; full-length text (600+ characters) for 80%+; a place found for 60%+. Outlets meeting the criteria spill over more (24.5% against 17.5%).",
   key: [["y_o", "outlet o's spillover, March 2026: stories centred in another county count 1, home stories naming another county ½, sports stories half that; ÷ all its placed stories", ""],
         ["\\beta_0", "intercept", "−0.81 (0.13)"],
         ["T_o", "1 if the outlet is a TV or radio broadcaster", ""],
         ["N_o", "print and digital news outlets active in the outlet's county (registry)", ""],
         ["\\beta_1", "T", "0.67 (0.15)"],
         ["\\beta_2", "ln(1 + N)", "−0.39 (0.12)"]],
   out: "Expected share for each outlet; a county's expectation weights its outlets by stories. Held-out error with term selection repeated in each fold: 6.57 points (intercept only 7.49)." },
 { t: "E  Civic interest area: the places a town's residents share",
   q: "Which places belong to a town's civic interest, and how likely is each?",
   eq: ["R_{hx} \\approx \\textstyle\\sum_{k=1}^{K} W_{hk} H_{kx}",
        "T_x \\propto \\textstyle\\sum_{h \\in \\text{town}} n_h\\, W_{hk^*} H_{k^*x}",
        "\\tau_x = T_x\\big(1 + \\omega\\,(0.3\\,O_x + 0.3\\,I_x + 0.7\\,P_x + 0.7\\,Q_x)\\big)",
        "\\displaystyle p_x = \\frac{1}{|\\mathcal{S}|}\\textstyle\\sum_{s \\in \\mathcal{S}} \\mathbf{1}[x \\in A_s], \\qquad |\\mathcal{S}| = 6{,}912"],
   est: "Non-negative matrix factorization of block-group travel (Columbia–Jefferson City television market); 6,912 equally weighted ways of drawing the map (a multiverse analysis).",
   key: [["R_{hx}", "share of block group h's residents seen at place x, January–July 2026 (Advan)", ""],
         ["W_{hk},\\ H_{kx}", "h's weight on travel pattern k; pattern k's reach to x. K: the largest number of patterns each holding 10%+ and 1,000+ of some town's residents and 10%+ of its travel, and recurring in odd and even months", "K = 2"],
         ["T_x;\\ n_h", "the town's travel to 3 km hexagon x: over the town's block groups h, residents n_h × travel attributed to the town's pattern k*, scaled so the busiest place is 50 (home 100)", ""],
         ["O_x,\\ I_x,\\ P_x,\\ Q_x", "news ties, each 0–1: the town's news about x; x's news about the town's county; places the town visits that x covers; places both cover", ""],
         ["\\omega", "weight on news ties, varied across the drawings", "0, ½, 1, 2"],
         ["A_s", "the area drawn by version s: seven drawing choices (hexagon 2–4 km, busiest place 50 or 100, spread within places, smoothing, selectivity, distance rule, reach) and ω", ""],
         ["D_{90}", "regular-travel distance: from the town's centre of population, the distance within which 90% of its residents' regular travel lies; regular = a destination seen from the home block group in all seven months", "Columbia 23.9 km; Mexico 48.1; Linn 70.5"]],
   out: "How likely each place x is to be part of the area. The area: the home part and every other part of 3+ hexagons with p ≥ 0.5 whose nearest hexagon lies within D₉₀." },
];
const root = document.getElementById("d");
const tex = (s, display) => katex.renderToString(s, { displayMode: !!display, throwOnError: true, output: "html" });
P.forEach((p) => {
  const el = document.createElement("div"); el.className = "panel";
  el.innerHTML = `<h3>${p.t}</h3>
    <div><span class="lab">Answers: </span>${p.q}</div>
    <div class="sec">Calculation</div>
    ${p.eq.map((e) => `<div class="eq">${tex(e)}</div>`).join("")}
    <div class="note">${p.est}</div>
    <div class="sec">Terms and fitted values</div>
    <table class="key">${p.key.map(([s, m, v]) => `<tr><td class="s">${tex(s)}</td><td>${m}</td><td class="v">${v}</td></tr>`).join("")}</table>
    <div class="out"><span class="lab">Output: </span>${p.out}</div>`;
  root.appendChild(el);
});
document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
document.body.dataset.ready = "1";
</script>
</body>
</html>
