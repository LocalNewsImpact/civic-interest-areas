<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Model diagram, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<style>
  /* 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: var(--s-2); }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .dd-footer { margin-top: var(--s-2); }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title">How the study's measures are calculated</h2>
  <p class="dd-subtitle">For each measure: the question it answers, the calculation, its inputs and its output</p>
  <div id="d"></div>
  <figcaption class="dd-footer"><span class="dd-source">Coefficients from models fitted to Missouri, all 115 counties
    (St. Louis city and county as one), printed by analysis/travel_model.py, coverage_model.py and spillover_outlets.py.
    Visits: Advan Research, Neighborhood Patterns Plus (Dewey Data), January–September 2026 (areas: January–July).
    Stories: Missouri School of Journalism analysis, March 2026. Commuting: LODES 2023.</span></figcaption>
</figure>
<script src="d3.min.js"></script>
<script>
// Coefficients are those printed by analysis/travel_model.py, coverage_model.py, spillover_outlets.py and
// analysis/build_unique_od.py; the civic interest area by flows/market_patterns.py and flows/area_ensemble.py.
const C = { ink: "#0b0b0b", mute: "#5b6370", rule: "#d9d8d0", panel: "#fafaf8", accent: "#003a56" };
const W = 528, svg = d3.select("#d").append("svg").attr("width", W);
let y = 0;
const MONO = "ui-monospace, SFMono-Regular, Menlo, monospace";
function txt(x, yy, t, o = {}) {
  const e = svg.append("text").attr("x", x).attr("y", yy).attr("font-size", o.size || 9.5)
    .attr("font-weight", o.weight || 400).attr("fill", o.fill || C.ink).text(t);
  if (o.mono) e.style("font-family", MONO).style("white-space", "pre");
  return e;
}
// one panel: title, the question the output answers, the calculation, a key of inputs, the output
function panel(letter, title, question, calc, key, output) {
  const top = y; y += 18;
  const g0 = svg.append("g");
  txt(10, y, `${letter}  ${title}`, { size: 11.5, weight: 650 }); y += 16;
  txt(10, y, "Answers:", { size: 9.5, weight: 600, fill: C.accent });
  question.forEach((q, i) => txt(58, y + i * 12, q, { size: 9.5 })); y += question.length * 12 + 8;
  txt(10, y, "Calculation", { size: 9, weight: 600, fill: C.mute }); y += 13;
  calc.forEach((c) => { txt(14, y, c, { size: 9.8 }).style("white-space", "pre"); y += 13; }); y += 6;
  txt(10, y, "Inputs", { size: 9, weight: 600, fill: C.mute }); y += 13;
  key.forEach(([sym, lines]) => {
    txt(14, y, sym, { mono: true, size: 9.2, weight: 600 });
    lines.forEach((l, i) => txt(78, y + i * 11.5, l, { size: 9 }));
    y += lines.length * 11.5 + 2.5;
  });
  y += 4;
  txt(10, y, "Output:", { size: 9.5, weight: 600, fill: C.accent });
  output.forEach((o, i) => txt(58, y + i * 12, o, { size: 9.5 })); y += output.length * 12 + 4;
  g0.lower();
  svg.insert("rect", ":first-child").attr("x", 0).attr("y", top + 4).attr("width", W).attr("height", y - top - 4)
    .attr("fill", C.panel).attr("stroke", C.rule);
  y += 8;
}

panel("A", "Travel: where each county's residents go",
  ["How many visits would residents of county i be expected to make to county j,",
   "given the distance between them, a shared border and commuting?"],
  ["V̂ᵢⱼ = exp( αᵢ + γⱼ − 0.98·Dᵢⱼ − 0.27·Dᵢⱼ² + Rᵢ·(0.51·Dᵢⱼ − 0.26·Dᵢⱼ²)",
   "              + 0.18·Pᵢ·Dᵢⱼ + 0.46·Bᵢⱼ + 0.28·Cᵢⱼ + 0.20·Cⱼᵢ )",
   "fitted by Poisson regression to Vᵢⱼ, every pair of 115 counties"],
  [["Vᵢⱼ", ["visits by residents of county i to county j, January–September 2026 (Advan Neighborhood",
            "Patterns Plus), scaled to people; visits to highway gas, convenience and fast-food stops removed"]],
   ["αᵢ", ["how much county i's residents travel overall (estimated, one per home county)"]],
   ["γⱼ", ["how strongly county j draws visitors from everywhere (estimated, one per destination)"]],
   ["Dᵢⱼ", ["ln(miles between the two counties' 2020 population centres ÷ 25)"]],
   ["Rᵢ", ["1 if county i is nonmetropolitan (USDA Rural-Urban Continuum codes 4–9), else 0"]],
   ["Pᵢ", ["ln(county i population) minus its Missouri mean (ACS 2020–2024)"]],
   ["Bᵢⱼ", ["1 if the two counties share a border, else 0"]],
   ["Cᵢⱼ", ["ln(1 + workers living in i who work in j, per 1,000 workers living in i) (LODES 2023)"]]],
  ["V̂ᵢⱼ, expected visits for every county pair. At 25 miles, twice the distance gives about half",
   "the visits from a metro county, three-quarters from a rural one; a shared border, 1.6 times.",
   "Each county predicted without its own data: R² 93.7%."]);

panel("B", "Crossover: how many of a county's residents go elsewhere",
  ["What share of a county's residents is seen outside the county in a month?"],
  ["crossover(county) = Σₕ min(Lₕ, Dₕ) ÷ Σₕ Dₕ,   where Dₕ = Eₕ^0.62 · Sₕ^0.38",
   "summed over the county's home block groups h; averaged January–September 2026"],
  [["Lₕ", ["residents of block group h seen in their single busiest block group outside the county",
            "(all distinct people, so a lower bound on residents who left) (Advan)"]],
   ["Sₕ", ["residents of h seen at home (Advan); inflated where Advan over-detects homes"]],
   ["Eₕ", ["ACS 2020–2024 population of h × the month's statewide phones per resident"]],
   ["0.62", ["share of the excess phones at home that behave like phantoms rather than residents,",
             "estimated across months (2SLS; 95% CI 0.53–0.71)"]]],
  ["share of residents seen outside the county: Audrain 44%, Boone 26%, Osage 59%",
   "(range over the CI of 0.62: Osage 57–61%)."]);

panel("C", "Coverage: which counties each county's newsrooms cover",
  ["How many stories would county k's newsrooms be expected to write about county j,",
   "given the same geography and how much their residents travel there?"],
  ["Ŝₖⱼ = exp( νₖ + μⱼ + [distance, border and commuting terms of A]",
   "              + 0.50·ln Vₖⱼ − 0.24·Rₖ·ln Vₖⱼ + ζ·Zₖⱼ )",
   "fitted by Poisson regression to Sₖⱼ, every newsroom county k and other county j"],
  [["Sₖⱼ", ["stories by newsrooms based in county k centred in or mentioning county j, March 2026",
            "(Missouri School of Journalism analysis; a story counts once for each county it names)"]],
   ["νₖ", ["how much county k's newsrooms publish overall (estimated, one per newsroom county)"]],
   ["μⱼ", ["how much county j is written about by newsrooms everywhere (estimated)"]],
   ["Vₖⱼ", ["residents' visits from county k to county j, as in A"]],
   ["Rₖ", ["1 if the newsroom county is nonmetropolitan, else 0"]],
   ["Zₖⱼ", ["1 if no visit was recorded (then ln Vₖⱼ = 0), else 0"]]],
  ["Ŝₖⱼ, expected stories. Twice the visits: 1.41 times the stories from metro newsrooms (2^0.50),",
   "1.20 times from rural ones (2^0.26)."]);

panel("D", "Spillover: how much of an outlet's news is about another county",
  ["What share of an outlet's stories would be expected to be about other counties?"],
  ["ŷₒ = 1 ÷ (1 + e^(−zₒ)),   zₒ = −0.81 + 0.67·Tₒ − 0.39·ln(1 + Nₒ)",
   "fitted by fractional logistic regression to yₒ, 85 well-collected outlets"],
  [["yₒ", ["outlet o's spillover, March 2026: stories centred in another county count 1, home stories",
            "mentioning another county ½, sports stories half that; ÷ all its stories placed in a county"]],
   ["Tₒ", ["1 if the outlet is a TV or radio broadcaster, else 0"]],
   ["Nₒ", ["print and digital news outlets active in the outlet's county (outlet registry)"]]],
  ["ŷₒ, expected share. With 2 print outlets in the county: print 22%, broadcaster 36%; with 5:",
   "print 18%, broadcaster 30%. A county's expectation: its outlets' ŷ weighted by their stories."]);

panel("E", "Civic interest area: the places a town's residents share",
  ["Which places are part of a town's residents' civic interest, and how likely is each?"],
  ["1  Rₕₓ ≈ Σₖ Wₕₖ · Hₖₓ      (travel patterns: non-negative matrix factorization)",
   "2  tieₓ = Tₓ · (1 + 0.3·Oₓ + 0.3·Iₓ + 0.7·Pₓ + 0.7·Qₓ)      (each 3 km hexagon x)",
   "3  pₓ = (versions s of 1,728 that draw x) ÷ 1,728",
   "4  area = home part + every part of 3+ hexagons with pₓ ≥ 0.5"],
  [["Rₕₓ", ["share of block group h's residents seen at place x, January–July 2026 (Advan)"]],
   ["Wₕₖ, Hₖₓ", ["h's weight on travel pattern k; pattern k's reach to place x. Patterns kept: each holds",
                 "10%+ and 1,000+ of some town's residents and 10%+ of its travel, and recurs in odd",
                 "and even months"]],
   ["Tₓ", ["the town's residents' travel to x in their pattern (busiest place = 50, home = 100)"]],
   ["Oₓ, Iₓ", ["the town's news about x; x's news about the town's county (each 0–1, March 2026 stories)"]],
   ["Pₓ, Qₓ", ["places the town visits that x's outlets cover; places both towns' outlets cover (0–1)"]],
   ["s", ["one version of the map: hexagon 2/3/4 km, busiest place 50/100, spread within places,",
          "smoothing, selectivity, distance rule, reach (all 1,728 combinations, weighted equally)"]]],
  ["pₓ, how likely each place is part of the area; the area outlined. Mexico's includes Columbia",
   "(39% of Audrain residents' out-of-county visits)."]);

svg.attr("height", y).attr("viewBox", [0, 0, W, y]);
document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
document.body.dataset.ready = "1";
</script>
</body>
</html>
