<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where residents are on an average day</title>
<link rel="stylesheet" href="https://data.localnewsimpact.org/static/css/tokens.1e94ec252665.css">
<link rel="stylesheet" href="https://data.localnewsimpact.org/static/css/datadesk.eaee6c6d0bbd.css">
<style>
  body { margin: 0; background: var(--bg, #f4f5f7); }
  .wrap { max-width: 64rem; margin: 24px auto; padding: 0 16px; }
  .figure { background: var(--surface, #fff); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px 18px; }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 20px; margin-top: 10px; }
  .panel h3 { font-size: var(--fs-sm); margin: 0 0 2px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-3); font-weight: 600; }
  .panel p.lede { font-size: var(--fs-sm); color: var(--text-2); margin: 0 0 6px; line-height: 1.4; min-height: 2.6em; }
  .panel .athome { font-size: var(--fs-sm); color: var(--text-2); margin: 0 0 2px; }
  .panel .athome b { font-size: 1.45rem; color: var(--ink); font-weight: 700; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap"><div class="figure">
<figure class="dd-visual">
  <h2 class="dd-title">A market is where people are, not where the county line is</h2>
  <p class="dd-subtitle">For each county, where its residents are when they are not at home. Each circle is one county, sized by the
    share of the home county's residents present there on an average day. Shares under 1% are not drawn.</p>
  <div class="panels" id="panels"></div>
  <figcaption class="dd-footer">
    <span class="dd-source">GeoDS Lab county-to-county mobility flows from SafeGraph phone data, daily files for March 2021
      (Kang et al., <i>Scientific Data</i>, 2020). A county's share is its part of all recorded presence of that county's
      residents, at home and away, averaged over the month.</span>
  </figcaption>
</figure>
</div></div>
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
const C = { grey: "#e8e8e6", line: "#ffffff", state: "#c3c2b7", home: "#0d366b", away: "#3880a1", ink: "#0b0b0b" };
const LEDE = {
  Audrain: "One Audrain resident in ten is in Boone County on an average day.",
  Boone: "Boone sends no more than 2% of its residents to any one county.",
  Osage: "More than a fifth of Osage residents are in Cole County on an average day.",
};
Promise.all([d3.json("counties-10m.json"), d3.json("presence.json")]).then(([topo, data]) => {
  const all = topojson.feature(topo, topo.objects.counties).features.filter((f) => String(f.id).startsWith("29"));
  const W = 330, H = 300;
  const panels = d3.select("#panels");
  // ONE SCALE, AND THE HOME COUNTY IS NOT ON IT. At 59-81% the home share is three to eighty times any other,
  // so a circle for it buries the counties the panel is about. It is stated above the map instead, and the
  // circles are scaled to the largest share away from home.
  const away = Object.values(data).flatMap((d) => d.rows.filter((r) => !r.home).map((r) => r.share));
  const r = d3.scaleSqrt([0, d3.max(away)], [0, 34]);
  // ONE WINDOW FOR ALL THREE PANELS, fitted to the counties the circles actually fall in rather than to
  // Missouri. At state scale the circles sat in a thumbnail of empty ground and could not be read.
  const drawn = new Set(Object.values(data).flatMap((d) => d.rows.map((x) => x.fips)));
  const frame = all.filter((f) => drawn.has(String(f.id)));
  const PROJ = d3.geoConicEqualArea().parallels([36.5, 40.5]).rotate([92.4, 0])
    .fitExtent([[10, 10], [W - 10, H - 10]], { type: "FeatureCollection", features: frame });
  for (const [home, d] of Object.entries(data)) {
    const rows = d.rows.filter((p) => !p.home).sort((a, b) => b.share - a.share);
    const athome = d.rows.find((p) => p.home);
    const div = panels.append("div").attr("class", "panel");
    div.append("h3").text(home + " County");
    div.append("p").attr("class", "lede").text(LEDE[home]);
    div.append("p").attr("class", "athome")
      .html(`<b>${Math.round(athome.share * 100)}%</b> are in ${home} County`);
    const svg = div.append("svg").attr("width", W).attr("height", H).attr("viewBox", [0, 0, W, H]);
    const proj = PROJ, path = d3.geoPath(proj);
    svg.append("g").selectAll("path").data(all).join("path").attr("d", path)
      .attr("fill", (f) => String(f.id) === d.fips ? C.home : C.grey)
      .attr("stroke", C.line).attr("stroke-width", 0.5);
    svg.append("path").attr("d", path(topojson.merge(topo, topo.objects.counties.geometries.filter((g) => String(g.id).startsWith("29")))))
      .attr("fill", "none").attr("stroke", C.state).attr("stroke-width", 0.8);
    const g = svg.append("g");
    for (const p of rows) {
      const [x, y] = proj([p.x, p.y]);
      g.append("circle").attr("cx", x).attr("cy", y).attr("r", r(p.share))
        .attr("fill", C.away).attr("fill-opacity", 0.8).attr("stroke", "#fff").attr("stroke-width", 0.8);
    }
    // every circle carries its county and share, outside the circle where the circle is small
    for (const p of rows) {
      const [x, y] = proj([p.x, p.y]), rad = r(p.share), inside = rad > 17;
      g.append("text").attr("x", x).attr("y", inside ? y + 4 : y - rad - 4).attr("text-anchor", "middle")
        .attr("font-size", inside ? 11.5 : 10).attr("font-weight", inside ? 700 : 600)
        .attr("fill", inside ? "#fff" : C.ink)
        .text(`${p.name} ${(p.share * 100).toFixed(1)}%`);
    }
  }
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
