<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Civic interest area, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<style>
  /* one town per figure, 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; padding: 0; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: var(--s-2); }
  .dd-ramp-strip { width: 16rem; }
  .dd-ramp { white-space: nowrap; flex-wrap: nowrap; }
  .dd-note { margin: var(--s-2) 0 0; font-size: .8rem; color: var(--text-3); }
  .dd-legend { row-gap: var(--s-2); margin-bottom: var(--s-2); align-items: center; }
  .dd-legend .item { display: inline-flex; align-items: center; color: var(--text-3); }
  .dd-legend svg { margin-right: .35rem; }
  .dd-swatch.base { background: #fafaf8; box-shadow: inset 0 0 0 1px #c3c2b7; }
  .dd-footer { margin-top: var(--s-2); }
  .dd-chart { min-height: 0; }
  table.mk { border-collapse: collapse; font-size: 11px; margin-top: var(--s-2); width: 100%; color: var(--text-2); }
  table.mk th { font-weight: 600; text-align: right; padding: 2px 4px; border-bottom: 1px solid #c3c2b7; }
  table.mk td { text-align: right; padding: 2px 4px; border-bottom: 1px solid #ecebe5; }
  table.mk th:first-child, table.mk td:first-child { text-align: left; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title" id="title"></h2>
  <p class="dd-subtitle" id="subtitle"></p>
  <div class="dd-legend" id="key"></div>
  <div class="dd-chart" id="map"></div>
  <p class="dd-note" id="note"></p>
  <figcaption class="dd-footer">
    <span class="dd-source">Source: Missouri School of Journalism analysis of local news stories (March 2026) and Advan
      Research, Neighborhood Patterns Plus (Dewey Data), January–July 2026; U.S. Census Bureau 2020 block groups and places;
      OpenStreetMap.</span>
  </figcaption>
</figure>
<script src="d3.min.js"></script>
<script>
// A town's civic interest area (primary, secondary, tertiary), one travel pattern per figure (travel_patterns.py, market_patterns.py): residents'
// travel decomposed into recurring patterns; the figure shows one pattern's places, its peak place = 100, and the table
// its market test -- crossover (demand) and spillover both ways (supply) for each county in it.
// ?town=Columbia|Mexico|Linn  ?rank=1|2|3 (primary, secondary, tertiary)
const q = new URLSearchParams(location.search);
const TOWN = q.get("town") || "Columbia", RANK = +(q.get("rank") || 1);
// ?tri=1: every title two lines tall, so the maps line up across a triptych
const TRI = !!q.get("tri");
let HOME = { Columbia: "29019", Mexico: "29007", Linn: "29151" }[TOWN];   // set from the data below for other towns
// ?region= one TV market (regions.json); its data file carries the market's counties, outline and town labels
// REGION: ?region=, else the region whose towns include ?town= (regions.json); default the Columbia-Jefferson City
// TV market, the only market the repository processes
let REGION = q.get("region") || "columbia";
const dataUrl = (r) => r === "columbia" ? "reach/market_pattern_maps.json" : `reach/${r}/market_pattern_maps.json`;
let DMA = [];
const T = { seqLow: "#d3ecfa", seqHigh: "#003a56", boundary: "#c3c2b7", ink: "#0b0b0b", muted: "#898781", surface: "#ffffff" };
const BASE = "#fafaf8", BASE_LINE = "#e6e5df";
// one ladder for all three figures, so a shade means the same reach on each
// SHOWN from 5. A TRANSIT corridor is the road itself, not a tract (a rural tract can cover half a county): the road
// segments half or more of the town's block groups use to reach the shown tracts, where they cross unshaded land
// (build_transit_lines.py)
let FLOOR = 5, CUTS = [10, 20, 40, 80]; const TRANSIT = "#4f7a92";
const LIFT_Q = new URLSearchParams(location.search).get("measure") === "lift";
if (LIFT_Q) { FLOOR = 2; CUTS = [5, 10, 20, 40]; }
// ?layer=story: the STORY-MAP layer on the same grid and frame -- where the home county's outlets report (green), with a
// white dot sized by central-focus stories; ?bare=1: the map alone, for the swipe page to stack two layers exactly
const STORY_LAYER = new URLSearchParams(location.search).get("layer") === "story";
const VOL = false;
// the left layer is the BUILDER'S STORY MAP (renderStoryMap in datadesk-chart.js): counties shaded by stories mentioning
// them, circles sized by stories centred on a place, overlapping and stacked largest first
const PER_HEX = +(new URLSearchParams(location.search).get("per") || 5);
const BARE = new URLSearchParams(location.search).get("bare") === "1";
if (STORY_LAYER) { T.seqLow = "#8cc47e"; T.seqHigh = "#0b3a1c"; FLOOR = 1; CUTS = [3, 10, 30, 100]; }
// ?measure=coverage: COVERAGE DENSITY (named by the authors, 2026-10-20), the supply side of the civic interest area assessment (analysis/area_coverage_alignment.py) -- each footprint
// hexagon shaded by the local stories a month whose area includes it (central focus 1, mention 0.5; each story's area set
// by its geographic scope). Breaks at the tiers: under weekly < 2, weekly 2+ (2-3 a month), daily 9+ (2-3 a week).
// ?cov=local leaves out stories placed only at county level and county mentions
const COVM = new URLSearchParams(location.search).get("measure") === "coverage";
const COVK = new URLSearchParams(location.search).get("cov") || "all";
// below the weekly floor is not shaded: under 2 stories a month is not coverage (authors, 2026-10-20)
// TIERS NAMED BY FREQUENCY -- frequent, regular, sporadic, none -- never daily/weekly, which name publications (authors,
// 2026-10-20: the two "collide semantically and visually"). TIERS, NOT ONE RAMP (authors, 2026-10-20: "one continuous color scale might be a mistake"): daily in greens whose steps
// show volume (9-29, 30-99, 100+), weekly in ochre, occasional (under 2) in light grey, none empty
if (COVM) { FLOOR = 0.005; CUTS = [2, 9, 30, 100]; }
// FREQUENT IS ONE COLOUR (authors, 2026-10-20): volume steps above 9 a month peaked in the population centres and showed
// population size, not what a resident receives -- the scale stops at frequent
// lines step back on the coverage map (authors, 2026-10-20: the grid and borders "overwhelm" the green): a fainter, thinner
// white grid; county borders in a light grey; home county and TV market thinner
const COV_DAILY = ["#3f7d3a"], COV_WEEKLY = "#d9a441", COV_OCC = "#e4e2da", COV_LINE = "#c9c7be";
const covFill = (v) => v >= 9 ? COV_DAILY[0] : v >= 2 ? COV_WEEKLY : COV_OCC;
if (BARE) document.head.insertAdjacentHTML("beforeend", "<style>.dd-title,.dd-subtitle,.dd-legend,.dd-footer{display:none}</style>");
function quantizeRamp(low, high, n) {   // datadesk-chart.js: steps spaced evenly in luminance
  const parse = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [parse(low), parse(high)];
  const at = (k) => a.map((v, j) => v + (b[j] - v) * k);
  const lum = (rgb) => { const lin = rgb.map((v) => { const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]; };
  const [lo, hi] = [lum(at(0)), lum(at(1))];
  const solve = (target) => { let l = 0, h = 1;
    for (let i = 0; i < 20; i += 1) { const m = (l + h) / 2; const x = lum(at(m));
      if (hi > lo ? x < target : x > target) l = m; else h = m; }
    return (l + h) / 2; };
  return Array.from({ length: n }, (_, i) => { const k = n === 1 ? 0 : solve(lo + ((hi - lo) * i) / (n - 1));
    return "#" + at(k).map((v) => Math.round(v).toString(16).padStart(2, "0")).join(""); });
}
const RAMP = quantizeRamp(T.seqLow, T.seqHigh, CUTS.length + 2);
const bandOf = (v) => { if (!(v >= FLOOR)) return 0; let k = 1; for (const c of CUTS) if (v >= c) k += 1; return k; };
const shade = (v) => (bandOf(v) ? RAMP[bandOf(v)] : BASE);

// ?conf=1: the approved map unchanged, with each shown hexagon marked by whether it holds in both halves of the year
// (analysis/confidence_layer.py: the same network tie from odd months and from even months). Core = clears the map's
// floor in both, drawn as approved; fringe = clears it in one half only, drawn lighter
const CONFM = new URLSearchParams(location.search).get("conf") === "1";   // ?conf=1 on the approved map
// ?corridors=1: the road from home to each place the map names as its direction (confidence_layer.py), drawn as the road
const CORRM = new URLSearchParams(location.search).get("corridors") === "1";
// ?outline=1: one line around the market as a connected, confident shape (confidence_layer.py)
// STABILITY FILTER, ON BY DEFAULT (authors, 2026-10-18: "random drives up route 63 can not possibly be enough signal to
// appear on the map"): only the connected area of hexagons that hold whichever months of data are used is drawn, with
// the ground between them filled (confidence_layer.py); ?outline=0 turns it off
const OUTM = new URLSearchParams(location.search).get("outline") !== "0";
const confUrl = (r) => r === "columbia" ? "reach/confidence_columbia.json" : `reach/${r}/confidence.json`;
// THE CIVIC INTEREST AREA (authors, 2026-10-25): each 3 km hexagon shaded by its likelihood of being part of the area -- the
// probability, under equal weighting of the ensemble's 6,912 versions, that a version draws it (flows/area_ensemble.py), the area's parts outlined (flows/area_core.py). No single-setting map is drawn
// as a product: one setting is one arbitrary member of the ensemble (the ?prob=0 switch is gone)
const PROBM = true;
const probUrl = (r) => r === "columbia" ? "reach/probability_columbia.json" : `reach/${r}/probability.json`;
(q.get("region") ? Promise.resolve(REGION)
  : d3.json("regions.json").then((C) => Object.keys(C).find((k) => TOWN in (C[k].towns || {})) || "columbia").catch(() => "columbia"))
.then((r) => { REGION = r; return Promise.all([d3.json("cousub_29.geojson"), d3.json(dataUrl(REGION)), (CONFM || CORRM || OUTM || COVM) ? d3.json(confUrl(REGION)) : Promise.resolve({}),
             COVM ? d3.json(`reach/coverage_${REGION}.json`) : Promise.resolve({}),
             COVM ? d3.json(`reach/diet_${REGION}.json`) : Promise.resolve({}),
             d3.json(probUrl(REGION)).catch(() => null)]).then(([geo, mp, CONF, COV, DIET, PROB]) => {
  const data = { labels: mp.market.labels.slice(), block_groups: mp.market.block_groups };
  const P0 = mp.towns[TOWN].find((p) => p.rank === RANK);
  // the QA coverage maps are drawn on the travel-only footprint; the area map on the published (network-tie) outline
  // the QA coverage maps are drawn on the TRAVEL-ONLY CORE of the settings ensemble (authors, 2026-10-25); the
  // area map, where no ensemble exists for the town, on its drawing outline
  const OUTL = (c) => (COVM ? ((PR && PR.core50_travel_outline) || c.outline_travel || c.outline) : c.outline);
  const PR = PROB && PROB[TOWN] && PROB[TOWN][RANK] ? PROB[TOWN][RANK] : null;
  const PRB = PROBM && PR && !COVM && !STORY_LAYER && !LIFT_Q && (q.get("measure") || "index") === "index" && (q.get("s") || "net") === "net";
  if (PRB) { FLOOR = 10; CUTS = [20, 40, 60, 80]; }
  HOME = mp.home[TOWN].county;
  if (!data.labels.some((l) => l.name === TOWN)) data.labels.push({ name: TOWN, lon: mp.home[TOWN].lon, lat: mp.home[TOWN].lat });
  // ?measure=index (default): travel x spillover out x spillover in; ?measure=travel: the travel pattern alone
  // ?s=net (default; authors, 2026-10-24: the paper's map is the network-tie area, travel strengthened by news ties);
  // ?s=travel: the travel-only area (no news term), the footprint of the supply QA maps; 1: earlier index; 0: raw travel
  const MEASURE = q.get("measure") || "index", SX = q.get("s") || "net";
  // ?measure=lift: what news ties add -- the network tie's percentage above the travel-only tie (both with the spatial
  // lag and direction, so the difference is news alone), where the travel-only tie is 5+
  const LIFT = MEASURE === "lift";
  const liftOf = () => { const t = P0.index.travel || P0.index["0"], n = P0.index.net, o = {};
    for (const [k, v] of Object.entries(t)) if (v >= 5 && v < 100 && n[k]) o[k] = Math.max(0, 100 * (n[k] / v - 1));
    return o; };
  const P = { ...P0, value: COVM ? COV[TOWN][RANK][COVK] : PRB ? Object.fromEntries(Object.entries(PR.p).map(([k, v]) => [k, 100 * v]))
    : MEASURE === "travel" ? P0.value : LIFT ? liftOf() : P0.index[SX] };
  const val = (id) => P.value[id] || 0;
  const counties = geo.counties.features;   // all Missouri counties; the frame shows those in this town's market
  const ORD = ["primary", "secondary", "tertiary"][RANK - 1];
  const who = data.block_groups[TOWN] === 1 ? `the block group around ${TOWN}` : TOWN;
  const dir = P0.toward && P0.toward.length ? `: toward ${P0.toward.join(" and ")}` : "";
  document.getElementById("title").textContent = q.get("tri") === "town" ? `${TOWN}${dir.replace(": t", ": t")}`
    : TRI ? `${ORD[0].toUpperCase() + ORD.slice(1)} market${dir}`
    : mp.towns[TOWN].length > 1 ? `${TOWN}'s civic interest area ${["I", "II", "III"][RANK - 1]}`
    : `${TOWN}'s civic interest area`;   // named 2026-10-20 (was "local information needs area", "information needs market", "revealed
    // news market"); no "toward" in the title; I, II, III only when the town has more than one area
  if (STORY_LAYER) document.getElementById("title").textContent = `Where ${TOWN}'s home-county news outlets report`;
  if (COVM) document.getElementById("title").textContent = document.getElementById("title").textContent + ": coverage density (QA)";
  if (LIFT) document.getElementById("title").textContent = TRI ? `What news ties add${dir ? "" : ""}` : `What news ties add to ${TOWN}'s civic interest area`;
  const covShare = (lo, hi) => { const v = Object.values(P.value); return Math.round(100 * v.filter((x) => x >= lo && x < hi).length / v.length); };
  document.getElementById("subtitle").textContent = COVM
    ? `Coverage density: local news stories a month whose area includes each 3 km hexagon, March 2026; a story centred there ` +
      `counts 1, one mentioning it 0.5; a story counts across the area its scope names (neighbourhood, town, region` +
      `${COVK === "local" ? "; stories placed only at county level left out" : ", county"}), less in each hexagon the ` +
      `larger that area (a town by the square root of its size; a county or region counted once, by where people live). ` +
      `Frequent coverage (9+ a month): ${covShare(9, 1e9)}% of the area; regular (2\u20138): ${covShare(2, 9)}%; ` +
      `sporadic (under 2): ${covShare(0.005, 2)}%; none: ${covShare(-1, 0.005)}%` +
      (q.get("balance") !== "0" ? `. Colour shows how many stories; size shows breadth \u2013 full size only where at least 8 of the 10 civic ` +
        `information categories (public safety, civic information, politics, education, environment, health, ` +
        `transportation, economic development, civic life, sports) each get a story a month \u2013 ` +
        `${Math.round(100 * Object.values((DIET[TOWN] || {})[RANK] || {}).filter((n) => n >= 8).length / Math.max(1, Object.keys(P.value).length))}% of the area` : "")
    : STORY_LAYER
    ? `${mp.story[TOWN].stories.toLocaleString()} local stories, March 2026: counties shaded by stories mentioning them; circles ` +
      `sized by stories centred on a place`
    : STORY_LAYER
    ? `${mp.story[TOWN].stories.toLocaleString()} local stories, March 2026, by 3 km hexagon: shade = stories centred there ` +
      `\u2013 a neighbourhood story shades its hexagon, a city story the city; shaded counties = stories mentioning the county or about it as a whole`
    : LIFT
    ? `How much news ties raise each place above the tie residents' travel alone gives it: coverage each way, and places ` +
      `both visit and report on; percent, by 3 km hexagon`
    :
    `About ${P.residents.toLocaleString()} residents of ${who} (${Math.round(100 * P.share)}%) travel in this pattern, ` +
    (MEASURE === "travel" || SX === "0" ? `January\u2013July 2026. Travel only, no news coverage: how much they go to each place, by 3 km hexagon, home = 100`
      : SX === "travel" ? `January\u2013July 2026. How local each place is: how much they go there, by 3 km hexagon, home = 100; ` +
        `dots: where news coverage strengthens the tie`
      : SX === "netcov" ? `January\u2013July 2026. How local each place is: their travel there, strengthened by news ties; and ` +
        `where the newsrooms inside their market report (${Object.keys(P0.newsrooms || {}).join(", ")}), at up to 0.3 of a travel tie; by 3 km hexagon, home = 100`
      : SX === "net" ? `January\u2013July 2026. How local each place is: their travel there, strengthened by news ties \u2013 ` +
        `coverage each way, and places both visit and report on; by 3 km hexagon, home = 100`
      : `January\u2013July 2026. How local each place is: their travel there, weighted by news coverage both ways ` +
        `(home outlets' stories located there; its outlets' stories located in home); by 3 km hexagon, home = 100`);
  const key = d3.select("#key");
  const ramp = key.append("span").attr("class", "dd-ramp");
  ramp.append("span").html(COVM ? `<span class="dd-swatch base"></span>under 2 a month &nbsp; Stories a month` : STORY_LAYER ? `Stories centred there` : LIFT ? `<span class="dd-swatch base"></span>under ${FLOOR}%`
    : PRB ? `How likely the place is part of the area&nbsp;&nbsp;<span class="dd-swatch base"></span>under 10%`
    : `<span class="dd-swatch base"></span>not shown: outside the ${Math.round(100 * (+(q.get("sel") || 0.5)))}% strongest ties`);
  if (STORY_LAYER) ramp.html(`Stories centred there<svg width="150" height="34" style="margin-left:.4rem;vertical-align:middle">` +
    `<circle cx="8" cy="17" r="2.6" fill="#0b0b0b" fill-opacity="0.55" stroke="#fff"/><text x="14" y="20.5" font-size="9" fill="currentColor">place</text>` +
    `<circle cx="58" cy="17" r="2.6" fill="#d9822b" fill-opacity="0.55" stroke="#fff"/><text x="64" y="20.5" font-size="9" fill="currentColor">neighbourhood</text>` +
    `</svg><span style="margin-left:4px">area by stories</span>`);
  const strip = STORY_LAYER ? d3.select(document.createElement("span")) : ramp.append("span").attr("class", "dd-ramp-strip");
  if (PRB) strip.style("width", "11rem");     // the likelihood key fits one line within the figure's width
  const blocks = strip.append("span").attr("class", "dd-ramp-blocks");
  RAMP.slice(1).forEach((c) => blocks.append("span").attr("class", "dd-ramp-block").style("background", c));
  const marks = strip.append("span").attr("class", "dd-ramp-marks");
  const edges = [FLOOR, ...CUTS];
  edges.forEach((v, i) => marks.append("span").attr("class", "dd-ramp-mark")
    .attr("data-align", i === 0 ? "start" : null)
    .style("left", `${(100 * i) / (CUTS.length + 1)}%`)
    .text(LIFT || PRB ? (i === edges.length - 1 ? `${v}%+` : `${v}%`) : (i === edges.length - 1 ? `${v}+` : `${v}`)));
  const item = (html) => key.append("span").attr("class", "item").html(html);
  if (COVM) {
    ramp.remove();
    const sw = (c, line) => `<span style="display:inline-block;width:14px;height:10px;background:${c};${line ? "border:0.5px solid #c9c7bd;" : ""}margin-right:4px;vertical-align:baseline"></span>`;
    const stops = d3.range(0, 1.001, 0.1).map((t) => d3.interpolateLab("#f1efe7", "#2f6b2f")(t)).join(",");
    if (q.get("balance") !== "0") {
      const hx = (cx, r) => d3.range(6).map((i) => { const a = Math.PI / 180 * (60 * i - 30);
        return `${(cx + r * Math.cos(a)).toFixed(2)},${(7 + r * Math.sin(a)).toFixed(2)}`; }).join(" ");
      item(`Breadth <svg width="66" height="14" style="vertical-align:middle;margin:0 4px"><polygon points="${hx(8, 2.8)}" fill="#2f6b2f"/>` +
        `<polygon points="${hx(30, 4.6)}" fill="#2f6b2f"/><polygon points="${hx(54, 7)}" fill="#2f6b2f"/></svg>few kinds \u2192 8+ of 10 kinds of civic information`);
    }
    item(`Stories a month: rarely <span style="display:inline-block;width:120px;height:10px;margin:0 6px;vertical-align:middle;` +
      `background:linear-gradient(to right,${stops})"></span> several a week or more`);
  }
  if (STORY_LAYER) item(`County in` + quantizeRamp("#d3ecfa", "#003a56", 5).slice(0, 4).map((c, i) =>
    `<span style="display:inline-block;width:16px;height:10px;background:${c};margin-left:${i ? 0 : 6}px;border:0.5px solid #d6d5cc"></span>`).join("") +
    `<span style="margin-left:4px">1, 5, 20, 60+ stories</span>`);
  if ((SX === "net" || SX === "travel") && !LIFT && !STORY_LAYER && !COVM && !PRB) {
    const hx = (cx, r) => d3.range(6).map((i) => { const a = Math.PI / 180 * (60 * i - 30);
      return `${(cx + r * Math.cos(a)).toFixed(2)},${(7 + r * Math.sin(a)).toFixed(2)}`; }).join(" ");
    const cells = [[0.3, "10%"], [0.5, "25%"], [0.7, "50%+"]].map(([f, t], i) => { const cx = 8 + i * 38;
      return `<polygon points="${hx(cx, 7)}" fill="${RAMP[3]}"/><circle cx="${cx}" cy="7" r="${(7 * f).toFixed(2)}" fill="#b4501e"/>` +
        `<text x="${cx + 10}" y="10.5" font-size="9" fill="currentColor">${t}</text>`; }).join("");
    item(`News ties add<svg width="118" height="14" style="margin-left:.35rem">${cells}</svg>`);
  }
  if (PRB) {
    // SHORT SUBTITLE, METHODS IN THE NOTE (authors, 2026-10-25): one or two lines above the map; the rest under it
    const sub_ = document.getElementById("subtitle").textContent;
    const PARTN_ = [...new Set((PR.core50_parts || []).filter((d) => !d.home).map((d) => d.name))];
    const km_ = (PR.core50_kept || {}).km2 || PR.core50_km2;
    // THE DISTANCE LIMIT (authors, 2026-10-25): no part beyond the town's regular-travel distance D90 (flows/regular_distance.py)
    const LIM_ = Math.round((PR.core50_limit || {}).km);
    // WORDING (authors, 2026-10-25): p is a likelihood under equal weighting of the 6,912 versions -- never "share of settings"
    document.getElementById("subtitle").textContent = `Across ${PR.members.toLocaleString()} equally plausible ways of drawing ` +
      `the map; outlined: the area, places likely 50% or more (${km_.toLocaleString()} km\u00b2)`;
    document.getElementById("note").textContent = `About ${P.residents.toLocaleString()} residents of ${who} ` +
      `(${Math.round(100 * P.share)}%) travel in this pattern, January\u2013July 2026. A place's tie: their travel there, ` +
      `strengthened by news ties \u2013 coverage each way, and places both visit and report on. Each of the ` +
      `${PR.members.toLocaleString()} versions (seven drawing choices: hexagon 2\u20134 km across, busiest place at 50 or 100, ` +
      `travel spread within towns and rural areas or not, spatial lag, selectivity, distance rule, reach; and the weight ` +
      `of the news ties, from none to double) is weighted equally, ` +
      `so the likelihood is conditional on that range of choices. The area: the home body and every other piece of three or ` +
      `more hexagons likely 50% or more${PARTN_ && PARTN_.length ? ` (${PARTN_.join(", ")})` : ""}, provided it starts within ` +
      `${LIM_} km of the town's centre \u2013 the distance within which 90% of its residents' regular travel (places visited ` +

  const LIFT_INK = "#b4501e";
  // news ties only: coverage-amplified tie (before adjacency and direction) against travel alone
  const liftAt = (id) => { const t = (P0.index["0"] || {})[id], n = (P0.index.cov || {})[id];
    return t && n && t < 100 ? n / t - 1 : 0; };
  const hexRpx = (() => { const id = [...on][0]; if (!id) return 2; const c = mp.hexes[id].slice(0, 6).map((p) => proj(p));
    const cx = d3.mean(c, (p) => p[0]), cy = d3.mean(c, (p) => p[1]); return Math.hypot(c[0][0] - cx, c[0][1] - cy); })();
  // dot area grows with lift; the smallest (10%) still reads at print size
  // dot area grows with the lift: 10% -> 0.3, 25% -> 0.5, 50%+ -> 0.7 of the hexagon's radius
  const dotR = (l) => hexRpx * (l >= 0.5 ? 0.7 : l >= 0.25 ? 0.5 : 0.3);
  if ((SX === "net" || SX === "travel") && !LIFT && !STORY_LAYER && !COVM && !PRB) {
    // dots mark news ties BETWEEN places: none in the home county, whose own outlets' coverage is the baseline (it stays in
    // the blue); a dot outside it is coverage reaching, or shared with, another county
    g.append("g").selectAll("circle").data([...on].filter((id) => liftAt(id) >= 0.10 && (mp.hex_county || {})[id] !== HOME)).join("circle")
      .attr("cx", (id) => d3.mean(mp.hexes[id].slice(0, 6), (p) => proj(p)[0]))
      .attr("cy", (id) => d3.mean(mp.hexes[id].slice(0, 6), (p) => proj(p)[1]))
      .attr("r", (id) => dotR(liftAt(id))).attr("fill", LIFT_INK).attr("stroke", "none");
  }
  g.append("g").selectAll("path").data(counties).join("path").attr("d", path)
    .attr("fill", "none").attr("stroke", COVM ? COV_LINE : T.muted).attr("stroke-width", COVM ? 0.5 : 0.75);
  // THE AREA'S PARTS (the core, p >= 0.5; home body and every piece of 3+ hexagons): an indicator, not a dominant line --
  // mid-grey plain ink, about half the earlier weight, no casing (authors, 2026-10-25), visible over the darkest hexagons
  if (PRB && PR.core50_outline) g.append("path").datum(PR.core50_outline).attr("d", path).attr("fill", "none")
    .attr("stroke", "#6f6d66").attr("stroke-width", 0.8).attr("stroke-linejoin", "round");
  g.append("path").datum(mp.market.outline).attr("d", path).attr("fill", "none").attr("stroke", COVM ? T.muted : T.ink)
    .attr("stroke-width", COVM ? 0.7 : 1.05).attr("stroke-dasharray", "3.4 2");
  // ?outline=1 draws no line (authors, 2026-10-18): the area it encloses decides which hexagons are drawn, and fills the
  // gaps with empty hexagons, so the market shows as one connected area of hexagons
  // with the market outline on, the home county steps back to a county border, a little heavier -- the outline leads
  g.append("path").datum(counties.find((f) => f.id === HOME)).attr("d", path).attr("fill", "none")
    .attr("stroke", COVM ? T.muted : OUTM ? T.muted : T.ink).attr("stroke-width", COVM ? 0.8 : OUTM ? 1.1 : 1.4);
  // SERVICE ZONES (authors, 2026-10-20): each outlet that is the largest single source for 3+ hexagons of the area, as a
  // circle on its newsroom holding half its story weight (analysis/area_coverage_alignment.py); named at
  // the circle's top so outlets sharing a town stay apart
  if (COVM && COV[TOWN][RANK].outlets && q.get("zones") === "1") {   // circles rejected (authors, 2026-10-20); ?zones=1 only
    const zones = COV[TOWN][RANK].outlets.slice().sort((a, b) => b.r_km - a.r_km);
    const zg = g.append("g");
    zg.selectAll("path").data(zones).join("path")
      .attr("d", (z) => path(d3.geoCircle().center([z.lon, z.lat]).radius(z.r_km / 111.2).precision(2)()))
      .attr("fill", "none").attr("stroke", T.ink).attr("stroke-width", 0.6).attr("stroke-opacity", 0.75);
    zg.selectAll("circle").data(zones).join("circle")
      .attr("cx", (z) => proj([z.lon, z.lat])[0]).attr("cy", (z) => proj([z.lon, z.lat])[1]).attr("r", 1.6).attr("fill", T.ink);
    zg.selectAll("text").data(zones).join("text")
      .attr("x", (z) => proj([z.lon, z.lat + z.r_km / 111.2])[0]).attr("y", (z) => proj([z.lon, z.lat + z.r_km / 111.2])[1] - 2)
      .attr("text-anchor", "middle").attr("font-size", 7.5).attr("fill", T.ink)
      .text((z) => z.outlet.replace(/\/News Tribune$/, "").replace(/ News$/, ""));
  }
  if (STORY_LAYER) {   // circles, the builder's way: area by stories, place = solid ink, neighbourhood = orange; stacked
    const pts = mp.story[TOWN].points;
    const rS = d3.scaleSqrt().domain([0, d3.max(pts, (p) => p.n) || 1]).range([0, 26]);
    g.append("g").selectAll("circle").data(pts.slice().sort((a, b) => b.n - a.n)).join("circle")
      .attr("cx", (p) => proj([p.lon, p.lat])[0]).attr("cy", (p) => proj([p.lon, p.lat])[1])
      .attr("r", (p) => Math.max(1.6, rS(p.n)))
      .attr("fill", (p) => (p.level === "block" ? "#d9822b" : "#0b0b0b")).attr("fill-opacity", 0.55)
      .attr("stroke", "#ffffff").attr("stroke-width", 0.6);
  }
  // TOWN NAMES IN PLAIN INK, never haloed, and never on a dark hexagon (20+): a dot at the town and its name beside it;
  // where the dark cells leave no room beside the dot, the name sits clear of them with a hairline to the dot
  const dark = [...on].filter((id) => P.value[id] >= 20).map((id) => {
    const c = mp.hexes[id].slice(0, 6).map((p) => proj(p));
    return [d3.mean(c, (p) => p[0]), d3.mean(c, (p) => p[1])]; });
  const hexR = (() => { const id = Object.keys(mp.hexes)[0]; const c = mp.hexes[id].slice(0, 6).map((p) => proj(p));
    const cx = d3.mean(c, (p) => p[0]), cy = d3.mean(c, (p) => p[1]); return Math.hypot(c[0][0] - cx, c[0][1] - cy); })();
  const overDark = (b) => dark.some(([cx, cy]) => cx > b[0] - hexR && cx < b[2] + hexR && cy > b[1] - hexR && cy < b[3] + hexR);
  // every sample point of the box within a dark (40+) hexagon
  const dark40 = [...on].filter((id) => P.value[id] >= 40).map((id) => { const c = mp.hexes[id].slice(0, 6).map((p) => proj(p));
    return [d3.mean(c, (p) => p[0]), d3.mean(c, (p) => p[1])]; });
  const allDark = (b) => { for (let i = 0; i <= 6; i++) for (let j = 0; j <= 2; j++) {
      const x = b[0] + ((b[2] - b[0]) * i) / 6, y = b[1] + ((b[3] - b[1]) * j) / 2;
      if (!dark40.some(([cx, cy]) => Math.hypot(cx - x, cy - y) <= hexR * 0.95)) return false; }
    return true; };
  const placed = [];
  const clear = (b) => b[0] >= 2 && b[1] >= 2 && b[2] <= W - 2 && b[3] <= H - 2 && !overDark(b)
    && !placed.some((o) => b[0] < o[2] + 1 && b[2] > o[0] - 1 && b[1] < o[3] + 1 && b[3] > o[1] - 1);
  // LABEL HIERARCHY: the home town bold; towns standing on a shaded hexagon in ink, the 8 most local x populous; for
  // orientation, up to 4 unshaded towns of 20,000+ in small grey; no other labels
  const onCentres = [...on].map((id) => { const c = mp.hexes[id].slice(0, 6).map((p) => proj(p));
    return [d3.mean(c, (p) => p[0]), d3.mean(c, (p) => p[1]), P.value[id]]; });
  const localAt = (x, y) => { let best = 0;
    for (const [cx, cy, v] of onCentres) if (Math.hypot(cx - x, cy - y) <= hexR && v > best) best = v;
    return best; };
  const inView = (x, y) => x >= 0 && x <= W && y >= 0 && y <= H;
  const cand = data.labels.map((l) => { const [x, y] = proj([l.lon, l.lat]); return { ...l, x, y, v: localAt(x, y) }; })
    .filter((l) => inView(l.x, l.y));
  const home = cand.filter((l) => l.name === TOWN);
  // every non-home part of the area is labelled by its largest town (area_core.py names it), ahead of the other towns
  const PARTN = new Set(PRB ? (PR.core50_parts || []).filter((d) => !d.home).map((d) => d.name) : []);
  const rankOf = (l) => (PARTN.has(l.name) ? 1e9 : 0) + l.v * Math.sqrt(l.pop || 1);
  const market = cand.filter((l) => l.name !== TOWN && (l.v >= FLOOR || PARTN.has(l.name))).sort((a, b) => rankOf(b) - rankOf(a)).slice(0, 8);
  const context = cand.filter((l) => l.name !== TOWN && l.v < FLOOR && (l.pop || 0) >= 20000).sort((a, b) => b.pop - a.pop).slice(0, 4);
  // CLUSTER LABELS: a group of 5+ shaded hexagons with no label inside it is named -- a landmark from the market's config
  // if one lies in it, else its most populous town -- in ink, like the market towns
  const comp = new Map(); let cid = 0;
  for (const id of on) {
    if (comp.has(id)) continue;
    const stack = [id]; comp.set(id, cid);
    while (stack.length) { const [q, r] = qr(stack.pop());
      for (const [dq, dr] of NB) { const n = `${q + dq},${r + dr}`; if (on.has(n) && !comp.has(n)) { comp.set(n, cid); stack.push(n); } } }
    cid += 1;
  }
  const hexOf = (lon, lat) => { const [x, y] = proj([lon, lat]);
    let best = null, bd = Infinity;
    for (const id of on) { const c = mp.hexes[id].slice(0, 6).map((p) => proj(p)); const cx = d3.mean(c, (p) => p[0]), cy = d3.mean(c, (p) => p[1]);
      const d = Math.hypot(cx - x, cy - y); if (d < bd) { bd = d; best = id; } }
    return bd <= hexR * 1.2 ? best : null; };
  const labelled = new Set([...home, ...market, ...context].map((l) => { const h = hexOf(l.lon, l.lat); return h ? comp.get(h) : -1; }));
  const sizes = d3.rollup([...comp.values()], (v) => v.length, (d) => d);
  const clusterLabels = [];
  for (const [c, n] of sizes) {
    if (n < 5 || labelled.has(c)) continue;
    const lm = (mp.landmarks || []).find((l) => comp.get(hexOf(l.lon, l.lat)) === c);
    const town = (mp.places || []).filter((l) => comp.get(hexOf(l.lon, l.lat)) === c).sort((a, b) => b.pop - a.pop)[0];
    const pick = lm || town;
    if (pick) { const [x, y] = proj([pick.lon, pick.lat]); clusterLabels.push({ ...pick, x, y, tier: 1, landmark: !!lm }); }
  }
  const tiers = [...home.map((l) => ({ ...l, tier: 0 })), ...market.map((l) => ({ ...l, tier: 1 })), ...clusterLabels,
    ...context.map((l) => ({ ...l, tier: 2 }))];
  for (const l of tiers) {
    const [x, y] = [l.x, l.y];
    const size = [8, 6.8, 6][l.tier], weight = [700, 500, 400][l.tier], ink = l.tier === 2 ? T.muted : T.ink;
    const t = g.append("text").attr("font-size", size).attr("font-weight", weight).attr("fill", ink)
      .attr("font-style", l.landmark ? "italic" : null).text(l.name);
    const w = t.node().getBBox().width;
    const box = (tx, ty, an) => { const x0 = an === "end" ? tx - w : an === "middle" ? tx - w / 2 : tx; return [x0, ty - size, x0 + w, ty + 2]; };
    let pick = null;
    // beside the dot first, then further out at 15-degree steps
    for (const dist of [3, 8, 13, 19, 26, 34, 44, 56]) {
      for (let deg = 0; deg < 360 && !pick; deg += dist === 3 ? 90 : 15) {
        const rad = (deg * Math.PI) / 180, dx = Math.cos(rad), dy = Math.sin(rad);
        const an = Math.abs(dx) < 0.3 ? "middle" : dx > 0 ? "start" : "end";
        const tx = x + dist * dx, ty = y + dist * dy + (Math.abs(dx) < 0.3 ? (dy > 0 ? size : 0) : size * 0.35);
        const b = box(tx, ty, an);
        // the home town's name may sit on its own dark hexagons (white ink there) rather than far off on a leader
        // the home name sits either wholly on dark hexagons (white ink) or wholly clear of them (ink) -- never across both
        const inFrame = b[0] >= 2 && b[1] >= 2 && b[2] <= W - 2 && b[3] <= H - 2
          && !placed.some((o) => b[0] < o[2] + 1 && b[2] > o[0] - 1 && b[1] < o[3] + 1 && b[3] > o[1] - 1);
        const ok = l.tier === 0 ? inFrame && (clear(b) || allDark(b)) : clear(b);
        if (ok) pick = { tx, ty, an, b, dist };
      }
      if (pick) break;
    }
    if (!pick) { t.remove(); continue; }
    placed.push(pick.b);
    t.attr("x", pick.tx).attr("y", pick.ty).attr("text-anchor", pick.an);
    if (l.tier === 0 && allDark(pick.b)) t.attr("fill", "#ffffff");
    if (pick.dist > 3) {
      const lx = Math.max(pick.b[0], Math.min(x, pick.b[2])), ly = Math.max(pick.b[1], Math.min(y, pick.b[3]));
      g.append("line").attr("x1", x).attr("y1", y).attr("x2", lx).attr("y2", ly).attr("stroke", T.ink).attr("stroke-width", 0.45);
    }
    g.append("circle").attr("cx", x).attr("cy", y).attr("r", l.tier === 2 ? 0.9 : 1.2).attr("fill", ink).attr("stroke", T.surface).attr("stroke-width", 0.4);
  }
  if (q.get("dump")) {   // the computed figure, for the swipe artifact: frame, shaded and ring hexagons, dots, placed labels
    const lifted = [...on].filter((id) => liftAt(id) >= 0.10 && (mp.hex_county || {})[id] !== HOME);
    const out = { frame: frame.type === "MultiPoint" ? frame.coordinates : null, home: HOME, W, H,
      on: [...on].map((id) => [id, +P.value[id].toFixed(1)]), ring: [...ring],
      lift: lifted.map((id) => [id, +liftAt(id).toFixed(3)]),
      labels: [...g.selectAll("text").nodes()].map((t) => ({ text: t.textContent, x: +t.getAttribute("x"), y: +t.getAttribute("y"),
        anchor: t.getAttribute("text-anchor"), size: +t.getAttribute("font-size"), weight: +t.getAttribute("font-weight"),
        fill: t.getAttribute("fill"), italic: t.getAttribute("font-style") === "italic" })),
      leaders: [...g.selectAll("line").nodes()].map((l) => ["x1", "y1", "x2", "y2"].map((a) => +l.getAttribute(a))),
      dots: [...g.selectAll("circle").nodes()].filter((c) => +c.getAttribute("r") <= 1.3).map((c) => [+c.getAttribute("cx"), +c.getAttribute("cy"), c.getAttribute("fill")]),
      floor: BASEF, title: document.getElementById("title").textContent, subtitle: document.getElementById("subtitle").textContent };
    const pre = document.createElement("pre"); pre.id = "dump"; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
  }
  // ?table=1: THE CIVIC INTEREST AREA AS A DATA TABLE for the datadesk builder (2026-10-22, authors: the Advan data is made
  // here and uploaded as a table; the builder draws the map and computes coverage itself). One row per hexagon in the
  // drawn area: shaded ones (shown = 1) and the empty ones inside the area's outline (shown = 0). Geometry is the hexagon
  // id: a 3 km grid, 1.5 km circumradius, x = lon * 111.32 * cos(38.7), y = lat * 110.57 (km), pointy-top axial (q, r).
  if (q.get("table") && !COVM && PR) {
    // THE AREA AS A DATA TABLE (2026-10-25): every hexagon drawn in 10%+ of the ensemble's settings, with its share of
    // settings p and whether it is in the area (a part of the multi-part core, named by area_core.py); home flagged
    const centreLL = (id) => [+d3.mean(mp.hexes[id].slice(0, 6), (p) => p[0]).toFixed(5), +d3.mean(mp.hexes[id].slice(0, 6), (p) => p[1]).toFixed(5)];
    const partOf = PR.core50_part_hexes || {}, homeSet = new Set(mp.home[TOWN].hexes || []);
    const rows = Object.entries(PR.p).filter(([id, pv]) => pv >= 0.1 && mp.hexes[id]).map(([id, pv]) => { const [lon, lat] = centreLL(id);
      return { region: REGION, town: TOWN, area: RANK, residents: P0.residents, share: +(+P0.share).toFixed(3), hex: id, lon, lat,
        p: +pv.toFixed(3), in_area: partOf[id] ? 1 : 0, part: partOf[id] || "", home: homeSet.has(id) ? 1 : 0 }; });
    const pre = document.createElement("pre"); pre.id = "table"; pre.textContent = JSON.stringify(rows); document.body.appendChild(pre);
  } else if (q.get("table") && !COVM) {
    const centreLL = (id) => [+d3.mean(mp.hexes[id].slice(0, 6), (p) => p[0]).toFixed(5), +d3.mean(mp.hexes[id].slice(0, 6), (p) => p[1]).toFixed(5)];
    const row = (id, shown) => { const [lon, lat] = centreLL(id); const v = +(P.value[id] || 0);
      const l = shown && (SX === "net" || SX === "travel") && (mp.hex_county || {})[id] !== HOME ? liftAt(id) : 0;
      return { region: REGION, town: TOWN, area: RANK, residents: P0.residents, share: +(+P0.share).toFixed(3), hex: id,
        lon, lat, travel: shown ? +v.toFixed(1) : 0, lift: l >= 0.10 ? +l.toFixed(3) : 0, shown: shown ? 1 : 0, home: v >= 100 ? 1 : 0,
        p: PR ? +((PR.p[id] || 0).toFixed(3)) : null }; };
    const rows = [...[...on].map((id) => row(id, true)), ...[...ring].map((id) => row(id, false))];
    // every hexagon drawn in 10%+ of settings, beyond the adopted map and its outline (shown = 0)
    if (PR) for (const [id, pv] of Object.entries(PR.p)) if (pv >= 0.1 && !on.has(id) && !ring.has(id) && mp.hexes[id]) rows.push(row(id, false));
    const pre = document.createElement("pre"); pre.id = "table"; pre.textContent = JSON.stringify(rows); document.body.appendChild(pre);
  }
  // ?figure=1: THE FIGURE FOR THE DATADESK BUILDER (civicarea / coveragemap kinds, 2026-10-21). Everything already
  // projected into the W x H frame, so the builder draws it without the travel model and two maps of one area share the
  // frame exactly (the swipe). Values travel with the hexagons so the builder colours them in its own themes.
  if (q.get("figure")) {
    const r1 = (d) => (d || "").replace(/(\d+\.\d)\d+/g, "$1");
    const centreOf = (id) => { const pts = mp.hexes[id].slice(0, 6).map((p) => proj(p));
      return [+d3.mean(pts, (p) => p[0]).toFixed(1), +d3.mean(pts, (p) => p[1]).toFixed(1)]; };
    const inFrame = (f) => { const b = path.bounds(f); return b[1][0] >= 0 && b[0][0] <= W && b[1][1] >= 0 && b[0][1] <= H; };
    const fig = {
      figure: 1, measure: COVM ? "coverage" : "area", region: REGION, town: TOWN, rank: RANK,
      areas_in_town: mp.towns[TOWN].length, W, H,
      title: document.getElementById("title").textContent, subtitle: document.getElementById("subtitle").textContent,
      residents: P0.residents, share: P0.share, tv_market: mp.market.name || null,
      counties: counties.filter(inFrame).map((f) => ({ id: f.id, d: r1(path(f)), home: f.id === HOME })),
      market: r1(path(mp.market.outline)),
      ring: [...ring].map((id) => r1(hexPath(id))),
      hexes: [...on].map((id) => {
        const h = { id, d: r1(hexPath(id)), c: centreOf(id), v: +(+P.value[id]).toFixed(2) };
        if (PR) h.p = +((PR.p[id] || 0).toFixed(3));
        if (COVM) h.n = (((DIET[TOWN] || {})[RANK] || {})[id]) || 0;
        else if ((SX === "net" || SX === "travel") && !LIFT && !PRB && (mp.hex_county || {})[id] !== HOME) { const l = liftAt(id); if (l >= 0.10) h.lift = +l.toFixed(3); }
        return h; }),
      labels: [...g.selectAll("text").nodes()].map((t) => ({ text: t.textContent, x: +t.getAttribute("x"), y: +t.getAttribute("y"),
        anchor: t.getAttribute("text-anchor"), size: +t.getAttribute("font-size"), weight: +t.getAttribute("font-weight") || 400,
        muted: t.getAttribute("fill") !== T.ink, italic: t.getAttribute("font-style") === "italic" })),
      leaders: [...g.selectAll("line").nodes()].map((l) => ["x1", "y1", "x2", "y2"].map((k) => +(+l.getAttribute(k)).toFixed(1))),
      dots: [...g.selectAll("circle").nodes()].filter((c) => +c.getAttribute("r") <= 1.3)
        .map((c) => [+(+c.getAttribute("cx")).toFixed(1), +(+c.getAttribute("cy")).toFixed(1), c.getAttribute("fill") === T.ink ? "ink" : "muted"]),
      scale: COVM ? { kind: "log", cap: 9, tiers: { frequent: 9, regular: 2 }, breadth_full: 8 }
                  : { kind: "bands", floor: FLOOR, cuts: CUTS },
      shares: COVM ? { frequent: covShare(9, 1e9), regular: covShare(2, 9), sporadic: covShare(0.005, 2), none: covShare(-1, 0.005),
        balanced: Math.round(100 * Object.values((DIET[TOWN] || {})[RANK] || {}).filter((n) => n >= 8).length / Math.max(1, Object.keys(P.value).length)) } : null,
      source: (document.querySelector(".dd-footer") || {}).textContent || "",
    };
    const pre = document.createElement("pre"); pre.id = "figure"; pre.textContent = JSON.stringify(fig); document.body.appendChild(pre);
  }
  document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
  document.body.dataset.ready = "1";
});
});
</script>
</body>
