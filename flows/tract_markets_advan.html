<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revealed media markets by tract, 2026</title>
<link rel="stylesheet" href="https://data.localnewsimpact.org/static/css/tokens.1e94ec252665.css">
<link rel="stylesheet" href="https://data.localnewsimpact.org/static/css/datadesk.eaee6c6d0bbd.css">
<style>
  body { margin: 0; background: var(--bg, #f4f5f7); }
  .wrap { max-width: 1180px; margin: 24px auto; padding: 0 16px; }
  .figure { background: var(--surface, #fff); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px 18px; }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; margin-top: 14px; }
  .tm-panel h3 { font-size: var(--fs-sm); margin: 0 0 4px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-3); font-weight: 600; }
  svg { display: block; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap"><div class="figure">
<figure class="dd-visual">
  <h2 class="dd-title">Revealed media markets in mid-Missouri</h2>
  <p class="dd-subtitle">A <i>revealed</i> media market is drawn from where people live and travel.</p>
  <div class="panels" id="panels"></div>
  <div id="key"></div>
  <figcaption class="dd-footer">
    <span class="dd-source">Mobility: Advan Neighborhood Patterns Plus (via Dewey), March 2026, Missouri destinations only.
      Tracts: U.S. Census Bureau 2020 boundaries. Boundaries: Nielsen
      designated market area.</span>
  </figcaption>
</figure>
</div></div>
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
// Each tract is shaded by its share of the county's travel OUTSIDE its own borders in March 2026: the
// county's devices recorded in the tract, over all its devices recorded in any Missouri tract outside the county
// (the Advan export holds Missouri destinations only; build_tract_shares_advan.py).
// Every county's outside travel is 100%, so Boone's far larger volume no longer washes its panel out and
// the three markets compare on shape, not size.
// each panel names its home county and the county its residents are most often recorded in
const STUDY = [
  { name: "Audrain", fips: "29007", dest: ["Boone", "29019"] },
  { name: "Boone", fips: "29019", dest: ["Cole", "29051"] },
  { name: "Osage", fips: "29151", dest: ["Cole", "29051"] },
];
const DMA = ["29007","29019","29027","29041","29051","29053","29089","29125","29131","29135","29139","29141","29151","29175"];
// Advan's smallest home-area entry is 16 (population-scaled), under 0.004% of any county's outside total, so the
// lightest class sits far above the floor
const BREAKS = [0.25, 0.5, 1, 2, 4, 8, 16];
const FILL = ["#eef8f8", "#d3eeef", "#a9dee0", "#79c6cb", "#4aa6b2", "#24809a", "#0d5a74"];
const C = { homeFill: "#dfe3e6", land: "#f6f6f5", tractLine: "#ffffff", county: "#c3c7cb", dma: "#6f7681", home: "#0b0b0b", mute: "#5a616b" };
const cls = (v) => { let k = -1; for (let i = 0; i < BREAKS.length; i++) if (v >= BREAKS[i]) k = i; return k; };

const SHARES = new URLSearchParams(location.search).get("data") || "tract_shares_advan_2026_03.json";
Promise.all([d3.json("tracts_29.json"), d3.json("counties-10m.json"), d3.json(SHARES)])
  .then(([tt, topo, rates]) => {
  // 2020 tracts, keyed by the 11-digit GEOID that the first 11 digits of an Advan block group give
  const tracts = topojson.feature(tt, tt.objects[Object.keys(tt.objects)[0]]);
  tracts.features.forEach((f) => { f.id = f.properties.GEOID; });
  const mo = topojson.feature(topo, topo.objects.counties).features.filter((f) => String(f.id).startsWith("29"));
  const frame = { type: "FeatureCollection", features: mo.filter((f) => DMA.includes(String(f.id))) };
  const W = 354, H = 404;
  const proj = d3.geoConicEqualArea().parallels([36.5, 40.5]).rotate([92.4, 0]).fitExtent([[6, 6], [W - 6, H - 6]], frame);
  const path = d3.geoPath(proj);
  const countyMesh = topojson.mesh(topo, topo.objects.counties, (a, b) => a !== b
    && String(a.id).startsWith("29") && String(b.id).startsWith("29"));
  const dmaOutline = topojson.merge(topo, topo.objects.counties.geometries.filter((g) => DMA.includes(String(g.id))));

  for (const s of STUDY) {
    const r = rates[s.name];
    const div = d3.select("#panels").append("div").attr("class", "tm-panel");
    div.append("h3").text(s.name + " County residents");
    const svg = div.append("svg").attr("width", W).attr("height", H).attr("viewBox", [0, 0, W, H]);
    svg.append("clipPath").attr("id", "clip" + s.fips).append("rect").attr("width", W).attr("height", H);
    const g = svg.append("g").attr("clip-path", `url(#clip${s.fips})`);
    g.append("g").selectAll("path").data(tracts.features).join("path").attr("d", path)
      // the home county is one flat tint: it is home by definition, and shading its own tracts by visits
      // made rural tracts with few destinations look like holes in it
      .attr("fill", (f) => {
        if (f.id.startsWith(s.fips)) return C.homeFill;
        const v = r[f.id]; const k = v ? cls(v.rate) : -1; return k < 0 ? C.land : FILL[k]; })
      .attr("stroke", C.tractLine).attr("stroke-width", 0.3);
    g.append("path").attr("d", path(countyMesh)).attr("fill", "none").attr("stroke", C.county).attr("stroke-width", 0.8);
    g.append("path").attr("d", path(dmaOutline)).attr("fill", "none").attr("stroke", C.dma).attr("stroke-width", 1.4);
    g.append("path").attr("d", path(mo.find((f) => String(f.id) === s.fips))).attr("fill", "none")
      .attr("stroke", C.home).attr("stroke-width", 1.6);
    // County names are placed by measurement, not on the centroid: Boone's centroid is Columbia, the very
    // tracts the panels exist to show. Every spot on a 6px grid inside the county is scored on how much of
    // the label would sit outside the county, on a shaded tract, or on a small (city) tract; the lowest wins.
    const shadedIn = (fips) => tracts.features.filter((f) => f.id.startsWith(fips) && !f.id.startsWith(s.fips)
      && r[f.id] && cls(r[f.id].rate) >= 0);
    // city tracts: under 200 px2 at this scale. Boone's run 3-195; its rural tracts 305 and up
    const smallIn = (fips) => tracts.features.filter((f) => f.id.startsWith(fips) && path.area(f) < 200);
    for (const [label, fips, weight] of [[s.name, s.fips, 600], [s.dest[0], s.dest[1], 400]]) {
      const cty = mo.find((f) => String(f.id) === fips);
      const t = g.append("text").attr("text-anchor", "middle").attr("font-size", 12.5)
        .attr("font-weight", weight).attr("fill", "#2a3038").text(label);
      const tw = t.node().getComputedTextLength(), th = 12;
      const shaded = shadedIn(fips), small = smallIn(fips), [[bx0, by0], [bx1, by1]] = path.bounds(cty);
      const c0 = path.centroid(cty);
      let best = null;
      for (let y = by0 + th; y <= by1; y += 6)
        for (let x = bx0 + tw / 2; x <= bx1 - tw / 2; x += 6) {
          let out = 0, onShade = 0, onSmall = 0;   // onShade sums (class+1)^2: dark costs more than pale
          // the box tested is the label plus a 5px margin, so a name never rests on the edge of a city
          for (let i = 0; i <= 4; i++) for (let j = 0; j <= 2; j++) {
            const ll = proj.invert([x - tw / 2 - 5 + (tw + 10) * i / 4, y - th - 5 + (th + 10) * j / 2]);
            if (!d3.geoContains(cty, ll)) out++;
            else {
              const hit = shaded.find((f) => d3.geoContains(f, ll));
              if (hit) onShade += (cls(r[hit.id].rate) + 1) ** 2;
              if (small.some((f) => d3.geoContains(f, ll))) onSmall++;
            }
          }
          const score = out * 100 + onShade + onSmall * 12 + Math.hypot(x - c0[0], y - c0[1]) / 120;
          if (!best || score < best.score) best = { score, x, y };
        }
      t.attr("x", best.x).attr("y", best.y);
      if (new URLSearchParams(location.search).get("probe")) {
        const areas = tracts.features.filter((f) => f.id.startsWith(fips)).map((f) => Math.round(path.area(f))).sort((a, b) => a - b);
        (window.PROBE = window.PROBE || []).push({ panel: s.name, label, best: [Math.round(best.x), Math.round(best.y), +best.score.toFixed(2)],
          bounds: path.bounds(cty).map((q) => q.map(Math.round)), nSmall: small.length, nShaded: shaded.length, areas: areas.slice(0, 40) });
        document.title = "PROBE" + JSON.stringify(window.PROBE);
      }
    }
  }

  // key: one row of classes
  const key = d3.select("#key").append("svg").attr("width", 1060).attr("height", 54);
  key.append("text").attr("x", 0).attr("y", 14).attr("font-size", 13).attr("fill", C.mute)
    .text("Share of the county's Missouri travel outside its borders, by tract, March 2026" + (SHARES.includes("work_hours") ? ", work hours" : ""));
  BREAKS.forEach((b, i) => {
    key.append("rect").attr("x", i * 80).attr("y", 24).attr("width", 76).attr("height", 12).attr("fill", FILL[i]);
    key.append("text").attr("x", i * 80).attr("y", 50).attr("font-size", 12).attr("fill", C.mute)
      .text(i === BREAKS.length - 1 ? b + "%+" : b + "–" + BREAKS[i + 1] + "%");
  });
  const kx = BREAKS.length * 80 + 40;
  key.append("rect").attr("x", kx).attr("y", 24).attr("width", 26).attr("height", 12).attr("fill", C.homeFill)
    .attr("stroke", C.home).attr("stroke-width", 1.4);
  key.append("text").attr("x", kx + 34).attr("y", 34).attr("font-size", 12).attr("fill", C.mute).text("Home county");
  key.append("line").attr("x1", kx + 150).attr("y1", 30).attr("x2", kx + 176).attr("y2", 30)
    .attr("stroke", C.dma).attr("stroke-width", 1.6);
  key.append("text").attr("x", kx + 184).attr("y", 34).attr("font-size", 12).attr("fill", C.mute)
    .text("Columbia\u2013Jefferson City television market");
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
