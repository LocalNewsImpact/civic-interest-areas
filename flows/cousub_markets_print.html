<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Revealed media market by county subdivision, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<style>
  /* one county per figure, 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; padding: 0; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: var(--s-2); }
  /* the builder's key, widened for print so the band marks stay legible at 5.5 in */
  .dd-ramp-strip { width: 14rem; }
  .dd-legend { row-gap: var(--s-2); margin-bottom: var(--s-2); align-items: center; }
  .dd-legend .item { display: inline-flex; align-items: center; color: var(--text-3); }
  .dd-legend svg { margin-right: .35rem; }
  .dd-swatch.home { background: #d6d5cc; border: 1.5px solid #0b0b0b; width: 14px; height: 10px; border-radius: 0; }
  .dd-swatch.base { background: #fafaf8; box-shadow: inset 0 0 0 1px #c3c2b7; }
  .dd-footer { margin-top: var(--s-2); }
  .dd-chart { min-height: 0; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title" id="title"></h2>
  <p class="dd-subtitle" id="subtitle"></p>
  <div class="dd-legend" id="key"></div>
  <div class="dd-chart" id="map"></div>
  <figcaption class="dd-footer">
    <span class="dd-source">Source: Advan Research, Neighborhood Patterns Plus (Dewey Data), January–September 2026, Missouri
      destinations; U.S. Census Bureau 2020 county subdivisions; Nielsen DMA.</span>
  </figcaption>
</figure>
<script src="d3.min.js"></script>
<script>
// The tract maps (tract_markets_advan_print.html) on county subdivisions, in the datadesk builder's style:
// lnic theme ramp, `missing` under the first cut, units outlined in their own shade.
// Only county subdivisions holding at least FLOOR% of the county's outside travel are shaded, each named for its city (build_cousub_labels.py), and the map is framed on
// them and the home county.
// ?county=Audrain|Boone|Osage   ?data=<cousub_shares file>   (build_cousub_shares.py)
const q = new URLSearchParams(location.search);
const SHARES = q.get("data") || "cousub_shares_advan_jan_sep.json";
const STUDY = { Audrain: "29007", Boone: "29019", Osage: "29151" };
const name = q.get("county") || "Osage", home = STUDY[name];
const DMA = ["29007","29019","29027","29041","29051","29053","29089","29125","29131","29135","29139","29141","29151","29175"];

// datadesk-chart.js, lnic light
const T = { seqLow: "#d3ecfa", seqHigh: "#003a56", missing: "#e1e0d9", boundary: "#c3c2b7", ink: "#0b0b0b",
  muted: "#898781", surface: "#ffffff" };
// A LIGHT BASE, A SHADED HOME. Everything under the cut is near-white, so the palest step of the ramp still reads
// against it; the home county is a flat neutral grey -- set apart from the base and from the blue scale alike.
const BASE = "#fafaf8", BASE_LINE = "#dddcd5", HOME = "#d6d5cc";
// one fixed ladder for all three figures, so a shade means the same share on each. Above 2% the shares run to
// 28% (Osage in Jefferson City), so the steps double
const FLOOR = 2, CUTS = [5, 10, 20];
function quantizeRamp(low, high, n) {   // datadesk-chart.js: steps spaced evenly in luminance
  const parse = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [parse(low), parse(high)];
  const at = (k) => a.map((v, j) => v + (b[j] - v) * k);
  const lum = (rgb) => { const lin = rgb.map((v) => { const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]; };
  const [lo, hi] = [lum(at(0)), lum(at(1))];
  const solve = (target) => { let l = 0, h = 1;
    for (let i = 0; i < 20; i += 1) { const m = (l + h) / 2; const x = lum(at(m));
      if (hi > lo ? x < target : x > target) l = m; else h = m; }
    return (l + h) / 2; };
  return Array.from({ length: n }, (_, i) => { const k = n === 1 ? 0 : solve(lo + ((hi - lo) * i) / (n - 1));
    return "#" + at(k).map((v) => Math.round(v).toString(16).padStart(2, "0")).join(""); });
}
const RAMP = quantizeRamp(T.seqLow, T.seqHigh, CUTS.length + 2);   // RAMP[0] unused, as in storyMapBands
const bandOf = (v) => { if (!(v >= FLOOR)) return 0; let k = 1; for (const c of CUTS) if (v >= c) k += 1; return k; };
const shade = (v) => (bandOf(v) ? RAMP[bandOf(v)] : BASE);
const edge = (v) => (bandOf(v) ? d3.hsl(shade(v)).brighter(0.35).formatHex() : BASE_LINE);

Promise.all([d3.json("cousub_29.geojson"), d3.json(SHARES), d3.json("cousub_labels.json")]).then(([geo, shares, LABEL]) => {
  const r = shares[name];
  const cous = geo.cousub.features, counties = geo.counties.features;
  // A PLACE IS A CITY, not a Census area: Columbia's two areas, Fulton's two and Jefferson City's three are one
  // place each, shaded as one and labelled once with their summed share (build_cousub_labels.py names the parts).
  // Only the market counts: an area outside the DMA is never shaded, even where it falls inside the frame.
  const placeOf = (f) => (LABEL[f.id] || f.properties.name).replace(/ \((east|west|north|south)\)$/, "");
  const places = d3.groups(cous.filter((f) => f.properties.county !== home && DMA.includes(f.properties.county)), placeOf)
    .map(([label, parts]) => ({ label, parts, share: d3.sum(parts, (f) => r[f.id] || 0),
      main: parts.reduce((a, b) => ((r[b.id] || 0) > (r[a.id] || 0) ? b : a)) }))
    .filter((pl) => bandOf(pl.share) > 0)
    .sort((a, b) => b.share - a.share);
  const shown = places.flatMap((pl) => pl.parts);
  const held = d3.sum(places, (pl) => pl.share);
  const placeById = new Map(places.flatMap((pl) => pl.parts.map((f) => [f.id, pl])));
  document.getElementById("title").textContent = `Where ${name} County residents travel in Missouri`;
  // the method is in the article text, not on the figure
  document.getElementById("subtitle").textContent =
    `Share of residents' visits outside the county, January\u2013September 2026` +
    (SHARES.includes("work_hours") ? ", work hours" : "");

  // key: the builder's ramp strip, then the lines
  const key = d3.select("#key");
  const ramp = key.append("span").attr("class", "dd-ramp");
  ramp.append("span").html(`<span class="dd-swatch base"></span>under ${FLOOR}%`);
  const strip = ramp.append("span").attr("class", "dd-ramp-strip");
  const blocks = strip.append("span").attr("class", "dd-ramp-blocks");
  RAMP.slice(1).forEach((c) => blocks.append("span").attr("class", "dd-ramp-block").style("background", c));
  const marks = strip.append("span").attr("class", "dd-ramp-marks");
  const edges = [FLOOR, ...CUTS];
  edges.forEach((v, i) => marks.append("span").attr("class", "dd-ramp-mark")
    .attr("data-align", i === 0 ? "start" : null)
    .style("left", `${(100 * i) / (CUTS.length + 1)}%`).text(i === edges.length - 1 ? `${v}%+` : `${v}%`));
  const item = (html) => key.append("span").attr("class", "item").html(html);
  item(`<span class="dd-swatch home"></span>${name} County (home)`);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${T.muted}" stroke-width="1.4"/></svg>County border`);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${T.ink}" stroke-width="1.6" stroke-dasharray="5 3"/></svg>Columbia–Jefferson City TV market`);

  // ONE FRAME FOR ALL THREE: the TV market, so the figures share a base and compare side by side
  const W = 354, H = 338, OUT = 528;
  const frame = { type: "FeatureCollection", features: counties.filter((f) => DMA.includes(f.id)) };
  const proj = d3.geoConicEqualArea().parallels([36.5, 40.5]).rotate([92.4, 0])
    .fitExtent([[4, 4], [W - 4, H - 4]], frame);
  const path = d3.geoPath(proj);
  const svg = d3.select("#map").append("svg").attr("width", OUT).attr("height", Math.round(OUT * H / W))
    .attr("viewBox", [0, 0, W, H]);
  svg.append("defs").append("clipPath").attr("id", "clip").append("rect").attr("width", W).attr("height", H);

  const g = svg.append("g").attr("clip-path", "url(#clip)");
  g.append("rect").attr("width", W).attr("height", H).attr("fill", T.surface);
  g.append("g").selectAll("path").data(cous).join("path").attr("d", path)
    .attr("fill", (f) => (f.properties.county === home ? HOME
      : placeById.has(f.id) ? shade(placeById.get(f.id).share) : BASE))
    .attr("stroke", (f) => (f.properties.county === home ? T.boundary
      : placeById.has(f.id) ? edge(placeById.get(f.id).share) : BASE_LINE))
    .attr("stroke-width", 0.35);
  g.append("g").selectAll("path").data(counties).join("path").attr("d", path)
    .attr("fill", "none").attr("stroke", T.muted).attr("stroke-width", 0.75);
  g.append("path").datum(geo.dma).attr("d", path).attr("fill", "none").attr("stroke", T.ink)
    .attr("stroke-width", 1.05).attr("stroke-dasharray", "3.4 2");
  g.append("path").datum(counties.find((f) => f.id === home)).attr("d", path).attr("fill", "none")
    .attr("stroke", T.ink).attr("stroke-width", 1.3);

  // LABELS ARE PLAIN INK ON THE MAP, never haloed. The home county's name sits inside it, on white. Each shaded
  // area is named beside it, on the grey, with a hairline to a dot inside the area: its fill can be the darkest
  // step, where ink cannot be read, and a city's area is often too small to hold its name.
  const placed = [];
  const boxOf = (x, y, w, h, anchor, size) => {
    const x0 = anchor === "end" ? x - w : anchor === "middle" ? x - w / 2 : x;
    return [x0, y - size, x0 + w, y - size + h];
  };
  const clear = (b) => b[0] >= 2 && b[1] >= 2 && b[2] <= W - 2 && b[3] <= H - 2
    && !placed.some((o) => b[0] < o[2] + 1.5 && b[2] > o[0] - 1.5 && b[1] < o[3] + 1.5 && b[3] > o[1] - 1.5);
  const homeF = counties.find((f) => f.id === home);
  const text = (lines, size, anchor) => {
    const t = g.append("text").attr("text-anchor", anchor).attr("font-size", size).attr("fill", T.ink);
    lines.forEach(([l, weight], i) => t.append("tspan").attr("x", 0).attr("dy", i ? size * 1.15 : 0)
      .attr("font-weight", weight).text(l));
    return { t, w: t.node().getBBox().width, h: size * 1.15 * lines.length };
  };
  const samples = (b) => { const pts = [];
    for (let i = 0; i <= 4; i++) for (let j = 0; j <= 2; j++)
      pts.push(proj.invert([b[0] + ((b[2] - b[0]) * i) / 4, b[1] + ((b[3] - b[1]) * j) / 2]));
    return pts; };

  // home county: the size and weight of the place names, so no label outranks the data. It sits in the ROOMIEST
  // part of the county -- the positions whose box keeps the widest clear margin to the border, and the middle of
  // those -- not near the centroid: Boone's centroid is its narrow waist, Osage's is against the river bends.
  {
    const size = 7.5;
    const [[bx0, by0], [bx1, by1]] = path.bounds(homeF);
    const fits = (b, m) => {
      for (let i = 0; i <= 8; i++) for (let j = 0; j <= 3; j++)
        if (!d3.geoContains(homeF, proj.invert([b[0] - m + ((b[2] - b[0] + 2 * m) * i) / 8,
          b[1] - m + ((b[3] - b[1] + 2 * m) * j) / 3]))) return false;
      return true;
    };
    const roomiest = (w, h) => {
      const cands = [];
      for (let y = by0; y <= by1 + h; y += 1.5) for (let x = bx0; x <= bx1; x += 1.5) {
        const b = boxOf(x, y, w, h, "middle", size);
        if (!clear(b)) continue;
        let m = -1;
        for (const k of [0, 2, 4, 6, 8, 10, 12, 15, 18]) { if (fits(b, k)) m = k; else break; }
        cands.push({ x, y, b, m });
      }
      const top = d3.max(cands, (c) => c.m);
      const roomy = cands.filter((c) => c.m === top);
      const mx = d3.mean(roomy, (c) => c.x), my = d3.mean(roomy, (c) => c.y);
      return d3.least(roomy, (c) => Math.hypot(c.x - mx, c.y - my));
    };
    // one line where it keeps a clear margin; stacked where the county is too narrow for it (Boone)
    let lab = text([[`${name} County`, 600]], size, "middle");
    let best = roomiest(lab.w, lab.h);
    if (!best || best.m < 4) {
      lab.t.remove();
      lab = text([[name, 600], ["County", 600]], size, "middle");
      best = roomiest(lab.w, lab.h);
    }
    placed.push(best.b);
    lab.t.attr("transform", `translate(${best.x},${best.y})`);
  }

  // a point inside an area: its centroid, or the inside point nearest it when the area wraps around something
  const inner = (f) => {
    const c = path.centroid(f);
    if (d3.geoContains(f, proj.invert(c))) return c;
    const [[x0, y0], [x1, y1]] = path.bounds(f);
    let best = null;
    for (let y = y0; y <= y1; y += 1) for (let x = x0; x <= x1; x += 1)
      if (d3.geoContains(f, proj.invert([x, y]))) {
        const d = Math.hypot(x - c[0], y - c[1]);
        if (!best || d < best.d) best = { d, p: [x, y] };
      }
    return best ? best.p : c;
  };
  const inShaded = (ll) => shown.some((f) => d3.geoContains(f, ll)) || d3.geoContains(homeF, ll);
  for (const pl of places) {
    const lines = [[pl.label, 600], [`${pl.share.toFixed(1)}%`, 400]];
    const a = inner(pl.main);
    let best = null;
    for (const dist of [16, 22, 30, 40, 52, 66])
      for (let deg = 0; deg < 360; deg += 15) {
        const rad = (deg * Math.PI) / 180, x = a[0] + dist * Math.cos(rad), y = a[1] + dist * Math.sin(rad);
        const anchor = Math.abs(Math.cos(rad)) < 0.3 ? "middle" : Math.cos(rad) > 0 ? "start" : "end";
        const probe = text(lines, 7.5, anchor); probe.t.remove();
        const b = boxOf(x, y, probe.w, probe.h, anchor, 7.5);
        if (!clear(b) || samples(b).some(inShaded)) continue;
        // a short leader first, then one that runs level or upright rather than at an odd angle
        const score = dist + (deg % 90 === 0 ? 0 : 3);
        if (!best || score < best.score) best = { score, x, y, b, anchor };
      }
    if (!best) continue;
    placed.push(best.b);
    const lx = Math.max(best.b[0], Math.min(a[0], best.b[2])), ly = Math.max(best.b[1], Math.min(a[1], best.b[3]));
    g.append("line").attr("x1", a[0]).attr("y1", a[1]).attr("x2", lx).attr("y2", ly)
      .attr("stroke", T.ink).attr("stroke-width", 0.45);
    g.append("circle").attr("cx", a[0]).attr("cy", a[1]).attr("r", 1.1).attr("fill", T.ink)
      .attr("stroke", T.surface).attr("stroke-width", 0.5);
    text(lines, 7.5, best.anchor).t.attr("transform", `translate(${best.x},${best.y})`);
  }
  document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
