<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Coverage against travel, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<style>
  /* one figure per home county (and Boone without broadcasters), 528 CSS px = 5.5 in, rendered at 3.125x */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; padding: 0; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: var(--s-2); }
  .dd-ramp-strip { width: 13rem; }
  .dd-legend { row-gap: var(--s-2); margin-bottom: var(--s-2); align-items: center; }
  .dd-legend .item { display: inline-flex; align-items: center; color: var(--text-3); }
  .dd-legend svg { margin-right: .35rem; }
  .dd-swatch.home { background: #d6d5cc; border: 1.5px solid #0b0b0b; width: 14px; height: 10px; border-radius: 0; }
  .dd-swatch.base { background: #fafaf8; box-shadow: inset 0 0 0 1px #c3c2b7; }
  .dd-footer { margin-top: var(--s-2); }
  .dd-chart { min-height: 0; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title" id="title"></h2>
  <p class="dd-subtitle" id="subtitle"></p>
  <div class="dd-legend" id="key"></div>
  <div class="dd-chart" id="map"></div>
  <figcaption class="dd-footer"><span class="dd-source" id="source"></span></figcaption>
</figure>
<script src="d3.min.js"></script>
<script>
// Coverage against travel, by county (alignment_2026_03.json, ../coverage/build_alignment.py). Both sides are a
// share of the home county's WHOLE total, home included, so the home county is shaded and compared like any other
// and keeps only its outline to mark it. Alignment is the smaller over the larger; the shade darkens toward 1:1.
// ?v=audrain_all | boone_all | boone_no_broadcast | osage_all
const q = new URLSearchParams(location.search);
// ?paper=1: the image as the journal sets it -- map and key only; the title, notes and source are the manuscript's caption
// (Journalism Studies style, authors 2026-10-29). ?panel=1 keeps a one-line panel name for a triptych
// A triptych panel prints at about 0.29 of its drawn size, so ?panel=1 drops the key (?keyonly=1 draws it once, above
// the three panels), enlarges the panel name, and ?ls= scales the county labels. ?names=1 labels each county by name
// only (Figure 3, authors 2026-10-29): the shares stay in the shading, and a name alone fits at the larger size
const PAPER = q.get("paper") === "1", PANEL = q.get("panel") === "1", KEYONLY = q.get("keyonly") === "1", LS = +(q.get("ls") || 1);
const NAMES = q.get("names") === "1";
if (PAPER) document.head.insertAdjacentHTML("beforeend", "<style>.dd-subtitle,.dd-footer{display:none}" +
  (PANEL ? ".dd-title{font-size:22px;margin-bottom:6px}.dd-legend{display:none}" : ".dd-title{display:none}") +
  (KEYONLY ? ".dd-title{display:none}.dd-chart{height:0;overflow:hidden}body{width:660px}.dd-legend{margin:0}" : "") + "</style>");
const V = q.get("v") || "osage_all";
const DMA = ["29007","29019","29027","29041","29051","29053","29089","29125","29131","29135","29139","29141","29151","29175"];
const T = { seqLow: "#d3ecfa", seqHigh: "#003a56", boundary: "#c3c2b7", ink: "#0b0b0b", muted: "#898781",
  surface: "#ffffff" };
const BASE = "#fafaf8", HOME = "#d6d5cc";
// ONE SIDE ONLY is not the faintest agreement, it is none, and the two sides are different findings: residents go
// and the newsrooms barely write about it (pale lnic orange), or the newsrooms write about a place residents seldom
// go (pale lnic violet). Both outside the blue scale. build_alignment.py decides which (kind).
const TRAVEL_ONLY = "#f6cdb6", STORIES_ONLY = "#d9d4f2";
const CUTS = [0.25, 0.5, 0.75];
function quantizeRamp(low, high, n) {   // datadesk-chart.js: steps spaced evenly in luminance
  const parse = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [parse(low), parse(high)];
  const at = (k) => a.map((v, j) => v + (b[j] - v) * k);
  const lum = (rgb) => { const lin = rgb.map((v) => { const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]; };
  const [lo, hi] = [lum(at(0)), lum(at(1))];
  const solve = (target) => { let l = 0, h = 1;
    for (let i = 0; i < 20; i += 1) { const m = (l + h) / 2; const x = lum(at(m));
      if (hi > lo ? x < target : x > target) l = m; else h = m; }
    return (l + h) / 2; };
  return Array.from({ length: n }, (_, i) => { const k = n === 1 ? 0 : solve(lo + ((hi - lo) * i) / (n - 1));
    return "#" + at(k).map((v) => Math.round(v).toString(16).padStart(2, "0")).join(""); });
}
const RAMP = quantizeRamp(T.seqLow, T.seqHigh, CUTS.length + 2);   // RAMP[0] unused
const bandOf = (a) => { let k = 1; for (const c of CUTS) if (a >= c) k += 1; return k; };
const fill = (row) => (row.kind === "travel_only" ? TRAVEL_ONLY : row.kind === "stories_only" ? STORIES_ONLY
  : RAMP[bandOf(row.alignment)]);
const dark = (row) => row.kind === "compare" && bandOf(row.alignment) >= 3;

Promise.all([d3.json("cousub_29.geojson"), d3.json("alignment_2026_03.json")]).then(([geo, all]) => {
  const d = all.maps[V], home = d.home, name = d.county, rows = d.counties, MIN = all.min_stories, FL = all.floor;
  const counties = geo.counties.features;
  const who = d.version === "no_broadcast" ? `${name} County's newspapers and digital outlets`
    : `${name} County's newsrooms`;
  document.getElementById("title").textContent = `Where ${name} County residents go, and where its news goes`;
  // the method is in the article text, not on the figure
  document.getElementById("subtitle").textContent =
    `Share of residents' visits outside the county (January\u2013September 2026) and of ${who}' stories about ` +
    `other counties (March 2026; mentions and sports stories count half)`;
  document.getElementById("source").textContent =
    `Source: visits, Advan Research, Neighborhood Patterns Plus (Dewey Data); coverage, Missouri School of ` +
    `Journalism analysis of ${name} County newsrooms' stories. U.S. Census Bureau 2020 boundaries; Nielsen DMA.`;

  const key = d3.select("#key");
  const ramp = key.append("span").attr("class", "dd-ramp");
  const strip = ramp.append("span").attr("class", "dd-ramp-strip");
  const blocks = strip.append("span").attr("class", "dd-ramp-blocks");
  RAMP.slice(1).forEach((c) => blocks.append("span").attr("class", "dd-ramp-block").style("background", c));
  const marks = strip.append("span").attr("class", "dd-ramp-marks");
  [["far apart", 0, "start"], ["", 0.5], ["1:1", 1, "end"]].forEach(([t, at, align]) =>
    marks.append("span").attr("class", "dd-ramp-mark").attr("data-align", align || null)
      .style("left", `${100 * at}%`).text(t));
  const item = (html) => key.append("span").attr("class", "item").html(html);
  item(`<span class="dd-swatch" style="background:${TRAVEL_ONLY}"></span>visits, under ${MIN} stories`);
  item(`<span class="dd-swatch" style="background:${STORIES_ONLY}"></span>stories, visits under ${FL}%`);
  item(`<span class="dd-swatch base"></span>neither`);
  // the home county is not compared (residents live there); its story counts are given for reference
  // the shared key of a triptych serves all three counties; the counts are in Table 2
  item(KEYONLY ? `<span class="dd-swatch home"></span>Home county`
    : `<span class="dd-swatch home"></span>${name} County (home): ${d.stories_home} stories about ${name}, ` +
      `${d.stories_away} about other counties`);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${T.ink}" stroke-width="1.6" stroke-dasharray="5 3"/></svg>Columbia–Jefferson City TV market`);

  const W = 354, H = 338, OUT = 528;
  const frame = { type: "FeatureCollection", features: counties.filter((f) => DMA.includes(f.id)) };
  const proj = d3.geoConicEqualArea().parallels([36.5, 40.5]).rotate([92.4, 0]).fitExtent([[4, 4], [W - 4, H - 4]], frame);
  const path = d3.geoPath(proj);
  const svg = d3.select("#map").append("svg").attr("width", OUT).attr("height", Math.round(OUT * H / W))
    .attr("viewBox", [0, 0, W, H]);
  svg.append("defs").append("clipPath").attr("id", "clip").append("rect").attr("width", W).attr("height", H);
  const g = svg.append("g").attr("clip-path", "url(#clip)");
  g.append("rect").attr("width", W).attr("height", H).attr("fill", T.surface);
  g.append("g").selectAll("path").data(counties).join("path").attr("d", path)
    .attr("fill", (f) => (rows[f.id] ? fill(rows[f.id]) : f.id === home ? HOME : BASE))
    .attr("stroke", T.muted).attr("stroke-width", 0.75);
  g.append("path").datum(geo.dma).attr("d", path).attr("fill", "none").attr("stroke", T.ink)
    .attr("stroke-width", 1.05).attr("stroke-dasharray", "3.4 2");
  g.append("path").datum(counties.find((f) => f.id === home)).attr("d", path).attr("fill", "none")
    .attr("stroke", T.ink).attr("stroke-width", 1.3);

  // LABELS IN PLAIN INK -- white on the two darkest steps, never haloed -- in the roomiest part of each county.
  const placed = [];
  const filled = counties.filter((f) => f.id === home || rows[f.id]);
  const label = (f, lines, size, colour) => {
    size *= LS;
    const t = g.append("text").attr("text-anchor", "middle").attr("font-size", size).attr("fill", colour);
    lines.forEach(([l, wt], i) => t.append("tspan").attr("x", 0).attr("dy", i ? size * 1.15 : 0).attr("font-weight", wt).text(l));
    const w = t.node().getBBox().width, h = size * 1.15 * lines.length;
    const [[bx0, by0], [bx1, by1]] = path.bounds(f);
    const fits = (b, m) => { for (let i = 0; i <= 6; i++) for (let j = 0; j <= 3; j++)
      if (!d3.geoContains(f, proj.invert([b[0] - m + ((b[2] - b[0] + 2 * m) * i) / 6, b[1] - m + ((b[3] - b[1] + 2 * m) * j) / 3]))) return false;
      return true; };
    const cands = [];
    for (let y = by0; y <= by1 + h; y += 1.5) for (let x = bx0; x <= bx1; x += 1.5) {
      const b = [x - w / 2, y - size, x + w / 2, y - size + h];
      if (b[0] < 2 || b[1] < 2 || b[2] > W - 2 || b[3] > H - 2) continue;
      if (placed.some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) continue;
      let m = -1; for (const k of [0, 1.5, 3, 5, 8]) { if (fits(b, k)) m = k; else break; }
      cands.push({ x, y, b, m });
    }
    const top = cands.length ? d3.max(cands, (c) => c.m) : -1;
    if (top < 0) {
      // TOO NARROW TO HOLD IT: beside the county on the plain base, in ink, with a hairline to a dot inside it --
      // never spilling white text across a border onto a light fill
      t.remove();
      const t2 = g.append("text").attr("text-anchor", "start").attr("font-size", size).attr("fill", T.ink);
      lines.forEach(([l, wt], i) => t2.append("tspan").attr("x", 0).attr("dy", i ? size * 1.15 : 0).attr("font-weight", wt).text(l));
      const c = path.centroid(f);
      const a = d3.geoContains(f, proj.invert(c)) ? c : (() => { let best = null;
        for (let y = by0; y <= by1; y += 1) for (let x = bx0; x <= bx1; x += 1)
          if (d3.geoContains(f, proj.invert([x, y]))) { const dd = Math.hypot(x - c[0], y - c[1]); if (!best || dd < best.d) best = { d: dd, p: [x, y] }; }
        return best ? best.p : c; })();
      // the box must sit wholly inside ONE unshaded county, a margin clear of its border, so no line -- county
      // border or market outline -- runs through the text
      const inside = (b) => {
        const pts = [];
        for (let i = 0; i <= 6; i++) for (let j = 0; j <= 3; j++)
          pts.push(proj.invert([b[0] - 1.5 + ((b[2] - b[0] + 3) * i) / 6, b[1] - 1.5 + ((b[3] - b[1] + 3) * j) / 3]));
        const host = counties.find((cf) => d3.geoContains(cf, pts[0]));
        return host && !filled.includes(host) && pts.every((ll) => d3.geoContains(host, ll));
      };
      let best = null;
      for (const dist of [16, 22, 30, 40, 52, 66, 82, 100]) for (let deg = 0; deg < 360; deg += 10) {
        const rad = (deg * Math.PI) / 180, x = a[0] + dist * Math.cos(rad), y = a[1] + dist * Math.sin(rad);
        const left = Math.cos(rad) < 0, b = [left ? x - w : x, y - size, left ? x : x + w, y - size + h];
        if (b[0] < 2 || b[1] < 2 || b[2] > W - 2 || b[3] > H - 2) continue;
        if (placed.some((o) => b[0] < o[2] + 1.5 && b[2] > o[0] - 1.5 && b[1] < o[3] + 1.5 && b[3] > o[1] - 1.5)) continue;
        if (!inside(b)) continue;
        const score = dist + (deg % 90 === 0 ? 0 : 3);
        if (!best || score < best.score) best = { score, x, y, b, left };
      }
      if (!best) { t2.remove(); return; }
      placed.push(best.b);
      const lx = Math.max(best.b[0], Math.min(a[0], best.b[2])), ly = Math.max(best.b[1], Math.min(a[1], best.b[3]));
      g.append("line").attr("x1", a[0]).attr("y1", a[1]).attr("x2", lx).attr("y2", ly).attr("stroke", T.ink).attr("stroke-width", 0.45);
      g.append("circle").attr("cx", a[0]).attr("cy", a[1]).attr("r", 1.1).attr("fill", T.ink).attr("stroke", T.surface).attr("stroke-width", 0.5);
      t2.attr("text-anchor", best.left ? "end" : "start").attr("transform", `translate(${best.x},${best.y})`);
      return;
    }
    const roomy = cands.filter((c) => c.m === top);
    const mx = d3.mean(roomy, (c) => c.x), my = d3.mean(roomy, (c) => c.y);
    const best = d3.least(roomy, (c) => Math.hypot(c.x - mx, c.y - my));
    placed.push(best.b);
    t.attr("transform", `translate(${best.x},${best.y})`);
  };
  // the home county is not compared -- residents live there -- so it carries the story counts, for reference
  label(counties.find((f) => f.id === home), [[name, 600], ["County", 600]], 7, T.ink);
  for (const [id, r] of Object.entries(rows).sort((a, b) => Math.max(b[1].travel, b[1].coverage) - Math.max(a[1].travel, a[1].coverage))) {
    label(counties.find((f) => f.id === id),
      NAMES ? [[r.name, 600]] : [[id === home ? `${r.name} (home)` : r.name, 600], [`visits ${r.travel.toFixed(1)}%`, 400],
       [`stories ${r.coverage.toFixed(1)}%`, 400]],   // the weighted share (Table 1), not a count of stories
      6.5, dark(r) ? "#ffffff" : T.ink);
  }
  if (PAPER && PANEL) document.getElementById("title").textContent = `${name} County`;
  document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
