<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revealed media market, print figure</title>
<style>
  /* one county per figure, 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #2a3038; }
  svg { display: block; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div id="map"></div>
<div id="key" style="margin-top: 8px"></div>
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
// Print version of tract_markets_advan.html: one home county per page, the same measure, classes and frame.
// ?county=Audrain|Boone|Osage   ?data=<tract_shares file>   (default: all devices, March 2026)
const q = new URLSearchParams(location.search);
const SHARES = q.get("data") || "tract_shares_advan_2026_03.json";
const STUDY = {
  Audrain: { fips: "29007", dest: ["Boone", "29019"] },
  Boone: { fips: "29019", dest: ["Cole", "29051"] },
  Osage: { fips: "29151", dest: ["Cole", "29051"] },
};
const name = q.get("county") || "Osage", s = STUDY[name];
const DMA = ["29007","29019","29027","29041","29051","29053","29089","29125","29131","29135","29139","29141","29151","29175"];
const BREAKS = [0.25, 0.5, 1, 2, 4, 8, 16];
const FILL = ["#eef8f8", "#d3eeef", "#a9dee0", "#79c6cb", "#4aa6b2", "#24809a", "#0d5a74"];
const C = { homeFill: "#dfe3e6", land: "#f6f6f5", tractLine: "#ffffff", county: "#8a9097", dma: "#2f353c", home: "#0b0b0b", mute: "#4a515b" };
const cls = (v) => { let k = -1; for (let i = 0; i < BREAKS.length; i++) if (v >= BREAKS[i]) k = i; return k; };

Promise.all([d3.json("tracts_29.json"), d3.json("counties-10m.json"), d3.json(SHARES)]).then(([tt, topo, rates]) => {
  const tobj = tt.objects[Object.keys(tt.objects)[0]];
  const tracts = topojson.feature(tt, tobj);
  tracts.features.forEach((f) => { f.id = f.properties.GEOID; });
  // every line is built from the tract topology: a county border is the tract edges where the 5-digit county
  // prefix changes, so it sits exactly on the tracts instead of on a generalized 1:10m county file
  const cof = (gm) => gm.properties.GEOID.slice(0, 5);
  const countyOf = (fips) => topojson.merge(tt, tobj.geometries.filter((gm) => cof(gm) === fips));
  const mo = [...new Set(tobj.geometries.map(cof))].map((fips) => ({ type: "Feature", id: fips, geometry: countyOf(fips) }));
  const frame = { type: "FeatureCollection", features: mo.filter((f) => DMA.includes(String(f.id))) };
  // drawn in the screen version's 354 x 404 units, so its label-placement thresholds hold, then scaled to 528 px
  const W = 354, H = 404, OUT = 528;
  const proj = d3.geoConicEqualArea().parallels([36.5, 40.5]).rotate([92.4, 0]).fitExtent([[6, 6], [W - 6, H - 6]], frame);
  const path = d3.geoPath(proj);
  const countyMesh = topojson.mesh(tt, tobj, (a, b) => a !== b && cof(a) !== cof(b));
  const stateEdge = topojson.mesh(tt, tobj, (a, b) => a === b);
  const dmaOutline = topojson.merge(tt, tobj.geometries.filter((gm) => DMA.includes(cof(gm))));
  const r = rates[name];

  const svg = d3.select("#map").append("svg").attr("width", OUT).attr("height", Math.round(OUT * H / W)).attr("viewBox", [0, 0, W, H]);
  svg.append("clipPath").attr("id", "clip").append("rect").attr("width", W).attr("height", H);
  const g = svg.append("g").attr("clip-path", "url(#clip)");
  g.append("g").selectAll("path").data(tracts.features).join("path").attr("d", path)
    .attr("fill", (f) => {
      if (f.id.startsWith(s.fips)) return C.homeFill;
      const v = r[f.id]; const k = v ? cls(v.rate) : -1; return k < 0 ? C.land : FILL[k]; })
    .attr("stroke", C.tractLine).attr("stroke-width", 0.3);
  // tract edges thin and white; county borders a mid grey at three times the weight, so both read
  g.append("path").attr("d", path(countyMesh)).attr("fill", "none").attr("stroke", C.county).attr("stroke-width", 0.8);
  g.append("path").attr("d", path(stateEdge)).attr("fill", "none").attr("stroke", C.county).attr("stroke-width", 0.8);
  // the market outline is dashed and darker so it does not read as one more county border
  g.append("path").attr("d", path(dmaOutline)).attr("fill", "none").attr("stroke", C.dma).attr("stroke-width", 1.2)
    .attr("stroke-dasharray", "4 2.5");
  g.append("path").attr("d", path(mo.find((f) => String(f.id) === s.fips))).attr("fill", "none")
    .attr("stroke", C.home).attr("stroke-width", 1.3);

  // label placement as in the screen version: the spot inside the county that covers the least shading and city
  const shadedIn = (fips) => tracts.features.filter((f) => f.id.startsWith(fips) && !f.id.startsWith(s.fips)
    && r[f.id] && cls(r[f.id].rate) >= 0);
  const smallIn = (fips) => tracts.features.filter((f) => f.id.startsWith(fips) && path.area(f) < 200);
  for (const [label, fips, weight] of [[name, s.fips, 700], [s.dest[0], s.dest[1], 400]]) {
    const cty = mo.find((f) => String(f.id) === fips);
    const t = g.append("text").attr("text-anchor", "middle").attr("font-size", 9)
      .attr("font-weight", weight).attr("fill", "#1f252c").attr("stroke", "#ffffff").attr("stroke-width", 2)
      .attr("stroke-linejoin", "round").attr("paint-order", "stroke").text(label);
    const tw = t.node().getComputedTextLength(), th = 9;
    const shaded = shadedIn(fips), small = smallIn(fips), [[bx0, by0], [bx1, by1]] = path.bounds(cty);
    const c0 = path.centroid(cty);
    let best = null;
    for (let y = by0 + th; y <= by1; y += 4)
      for (let x = bx0 + tw / 2; x <= bx1 - tw / 2; x += 4) {
        let out = 0, onShade = 0, onSmall = 0;
        for (let i = 0; i <= 4; i++) for (let j = 0; j <= 2; j++) {
          const ll = proj.invert([x - tw / 2 - 4 + (tw + 8) * i / 4, y - th - 4 + (th + 8) * j / 2]);
          if (!d3.geoContains(cty, ll)) out++;
          else {
            const hit = shaded.find((f) => d3.geoContains(f, ll));
            if (hit) onShade += (cls(r[hit.id].rate) + 1) ** 2;
            if (small.some((f) => d3.geoContains(f, ll))) onSmall++;
          }
        }
        const score = out * 100 + onShade + onSmall * 12 + Math.hypot(x - c0[0], y - c0[1]) / 120;
        if (!best || score < best.score) best = { score, x, y };
      }
    t.attr("x", best.x).attr("y", best.y);
  }

  // key: classes on one row, the two outlines on a second
  const key = d3.select("#key").append("svg").attr("width", OUT).attr("height", 84);
  key.append("text").attr("x", 0).attr("y", 14).attr("font-size", 11.5).attr("fill", C.mute)
    .text("Share of the county's Missouri travel outside its borders, by tract"
      + (SHARES.includes("work_hours") ? ", work hours" : ""));
  const sw = OUT / BREAKS.length;
  BREAKS.forEach((b, i) => {
    key.append("rect").attr("x", i * sw).attr("y", 22).attr("width", sw - 3).attr("height", 11)
      .attr("fill", FILL[i]).attr("stroke", i === 0 ? "#d6dadd" : "none").attr("stroke-width", 0.5);
    key.append("text").attr("x", i * sw).attr("y", 46).attr("font-size", 10.5).attr("fill", C.mute)
      .text(i === BREAKS.length - 1 ? b + "%+" : b + "–" + BREAKS[i + 1] + "%");
  });
  key.append("rect").attr("x", 0.7).attr("y", 62).attr("width", 24).attr("height", 11).attr("fill", C.homeFill)
    .attr("stroke", C.home).attr("stroke-width", 1.2);
  key.append("text").attr("x", 32).attr("y", 72).attr("font-size", 10.5).attr("fill", C.mute).text("Home county");
  key.append("line").attr("x1", 130).attr("y1", 67.5).attr("x2", 156).attr("y2", 67.5).attr("stroke", C.dma).attr("stroke-width", 1.6).attr("stroke-dasharray", "6 3.5");
  key.append("text").attr("x", 164).attr("y", 72).attr("font-size", 10.5).attr("fill", C.mute)
    .text("Columbia–Jefferson City television market (Nielsen DMA)");
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
