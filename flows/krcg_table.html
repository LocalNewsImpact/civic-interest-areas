<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="https://data.localnewsimpact.org/">
<title>KRCG coverage of the five counties</title>
<link rel="stylesheet" href="/static/css/tokens.1e94ec252665.css">
<link rel="stylesheet" href="/static/css/datadesk.eaee6c6d0bbd.css">
<style>
  body { margin: 0; background: var(--bg, #f4f5f7); }
  .wrap { max-width: 34rem; margin: 24px auto; padding: 0 16px; }
  .figure { background: var(--surface, #fff); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px 18px; }
  .dd-table th { font-size: var(--fs-xs, .78rem); white-space: nowrap; }
  .dd-table th.num { text-align: right; }
  .dd-table td.pub { white-space: nowrap; }
  .dd-table thead th { border-bottom: 2px solid var(--border); font-weight: 600; }
  /* the rule under the last row closed off a table that has nothing after it */
  .dd-table tbody tr:last-child td { border-bottom: none; }
  .note { font-size: var(--fs-sm); color: var(--text-2); line-height: 1.45; margin: .7rem 0 0; }
</style>
</head>
<body>
<div class="wrap"><div class="figure">
<figure class="dd-visual">
  <h2 class="dd-title">KRCG-TV</h2>
  <p class="dd-subtitle">Articles published in March 2026 that name a place in each of the five counties. Jefferson City is
    KRCG's city of licence; its studio is in New Bloomfield, Callaway County.</p>
  <table class="dd-table">
    <thead><tr><th>County</th><th class="num">Articles</th></tr></thead>
    <tbody>
      <tr><td class="pub">Boone</td><td class="num">107</td></tr>
      <tr><td class="pub">Cole</td><td class="num">70</td></tr>
      <tr><td class="pub">Callaway</td><td class="num">32</td></tr>
      <tr><td class="pub">Audrain</td><td class="num">11</td></tr>
      <tr><td class="pub">Osage</td><td class="num">4</td></tr>
    </tbody>
  </table>
  <figcaption class="dd-footer">
    <span class="dd-source">Missouri School of Journalism analysis of articles published in March 2026 and geolocated, counted
      once per article per county. An article naming two counties appears in both rows, so the column does not sum to the
      number of articles.</span>
  </figcaption>
</figure>
</div></div>
</body>
</html>
