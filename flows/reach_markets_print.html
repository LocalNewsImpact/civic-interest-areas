<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Revealed media market index, print figure</title>
<link rel="stylesheet" href="dd/css/fonts.css">
<link rel="stylesheet" href="dd/css/tokens.css">
<link rel="stylesheet" href="dd/css/datadesk.css">
<style>
  /* one town per figure, 528 CSS px = 5.5 in; rendered at 3.125x for 300 dpi */
  html, body { margin: 0; background: #ffffff; }
  body { width: 528px; padding: 0; }
  .dd-visual { padding: 0; }
  .dd-subtitle { margin-bottom: var(--s-2); }
  .dd-ramp-strip { width: 16rem; }
  .dd-legend { row-gap: var(--s-2); margin-bottom: var(--s-2); align-items: center; }
  .dd-legend .item { display: inline-flex; align-items: center; color: var(--text-3); }
  .dd-legend svg { margin-right: .35rem; }
  .dd-swatch.base { background: #fafaf8; box-shadow: inset 0 0 0 1px #c3c2b7; }
  .dd-footer { margin-top: var(--s-2); }
  .dd-chart { min-height: 0; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<figure class="dd-visual">
  <h2 class="dd-title" id="title"></h2>
  <p class="dd-subtitle" id="subtitle"></p>
  <div class="dd-legend" id="key"></div>
  <div class="dd-chart" id="map"></div>
  <figcaption class="dd-footer">
    <span class="dd-source">Source: Missouri School of Journalism analysis of local news stories (March 2026) and Advan
      Research, Neighborhood Patterns Plus (Dewey Data), January–July 2026; U.S. Census Bureau 2020 tracts and places;
      OpenStreetMap roads; Nielsen DMA.</span>
  </figcaption>
</figure>
<script src="d3.min.js"></script>
<script>
// Revealed media market index by tract (build_interest_map.py): 100 x residents' travel (the median over the town's home
// block groups, a town counted as one unit) x the magnification where the home county's own outlets report; the home
// town is 100. ?town=Columbia|Mexico|Linn  ?w=0.5|1|2 (the magnification weight; 1 by default)
const q = new URLSearchParams(location.search);
const TOWN = q.get("town") || "Columbia", WEIGHT = q.get("w") || "1";
const HOME = { Columbia: "29019", Mexico: "29007", Linn: "29151" }[TOWN];
const DMA = ["29007","29019","29027","29041","29051","29053","29089","29125","29131","29135","29139","29141","29151","29175"];
const T = { seqLow: "#d3ecfa", seqHigh: "#003a56", boundary: "#c3c2b7", ink: "#0b0b0b", muted: "#898781", surface: "#ffffff" };
const BASE = "#fafaf8", BASE_LINE = "#e6e5df";
// one ladder for all three figures, so a shade means the same reach on each
// SHOWN from 5. A TRANSIT corridor is the road itself, not a tract (a rural tract can cover half a county): the road
// segments half or more of the town's block groups use to reach the shown tracts, where they cross unshaded land
// (build_transit_lines.py)
const FLOOR = 5, CUTS = [10, 20, 40, 80], TRANSIT = "#4f7a92";
function quantizeRamp(low, high, n) {   // datadesk-chart.js: steps spaced evenly in luminance
  const parse = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [a, b] = [parse(low), parse(high)];
  const at = (k) => a.map((v, j) => v + (b[j] - v) * k);
  const lum = (rgb) => { const lin = rgb.map((v) => { const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]; };
  const [lo, hi] = [lum(at(0)), lum(at(1))];
  const solve = (target) => { let l = 0, h = 1;
    for (let i = 0; i < 20; i += 1) { const m = (l + h) / 2; const x = lum(at(m));
      if (hi > lo ? x < target : x > target) l = m; else h = m; }
    return (l + h) / 2; };
  return Array.from({ length: n }, (_, i) => { const k = n === 1 ? 0 : solve(lo + ((hi - lo) * i) / (n - 1));
    return "#" + at(k).map((v) => Math.round(v).toString(16).padStart(2, "0")).join(""); });
}
const RAMP = quantizeRamp(T.seqLow, T.seqHigh, CUTS.length + 2);
const bandOf = (v) => { if (!(v >= FLOOR)) return 0; let k = 1; for (const c of CUTS) if (v >= c) k += 1; return k; };
const shade = (v) => (bandOf(v) ? RAMP[bandOf(v)] : BASE);

Promise.all([d3.json("reach/tracts_dma.geojson"), d3.json("reach/reach_towns.json"), d3.json("cousub_29.geojson"),
  d3.json("reach/interest_towns.json"), d3.json("reach/transit_lines.json")]).then(([tg, data, geo, interest, roads]) => {
  const r = interest[TOWN].index[WEIGHT];
  const val = (id) => r[id] || 0;
  const counties = geo.counties.features.filter((f) => DMA.includes(f.id));
  document.getElementById("title").textContent = `Where ${TOWN} residents' local news interest reaches`;
  // a town smaller than its block group (Linn) is that one block group
  const nBg = data.block_groups[TOWN];
  document.getElementById("subtitle").textContent =
    `Revealed media market index: where ${nBg === 1 ? `residents of the block group around ${TOWN}` : `${TOWN} residents`} travel, ` +
    `magnified where their own county's news outlets also report; home town = 100`;

  const key = d3.select("#key");
  const ramp = key.append("span").attr("class", "dd-ramp");
  ramp.append("span").html(`<span class="dd-swatch base"></span>under ${FLOOR}`);
  const strip = ramp.append("span").attr("class", "dd-ramp-strip");
  const blocks = strip.append("span").attr("class", "dd-ramp-blocks");
  RAMP.slice(1).forEach((c) => blocks.append("span").attr("class", "dd-ramp-block").style("background", c));
  const marks = strip.append("span").attr("class", "dd-ramp-marks");
  const edges = [FLOOR, ...CUTS];
  edges.forEach((v, i) => marks.append("span").attr("class", "dd-ramp-mark")
    .attr("data-align", i === 0 ? "start" : null)
    .style("left", `${(100 * i) / (CUTS.length + 1)}%`).text(i === edges.length - 1 ? `${v}+` : `${v}`));
  const item = (html) => key.append("span").attr("class", "item").html(html);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${TRANSIT}" stroke-width="2" stroke-linecap="round"/></svg>Road residents travel on the way`);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${T.ink}" stroke-width="1.6"/></svg>Home county`);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${T.muted}" stroke-width="1.2"/></svg>County border`);
  item(`<svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${T.ink}" stroke-width="1.4" stroke-dasharray="5 3"/></svg>Columbia–Jefferson City TV market`);

  const W = 354, H = 338, OUT = 528;
  const frame = { type: "FeatureCollection", features: counties };
  const proj = d3.geoConicEqualArea().parallels([36.5, 40.5]).rotate([92.4, 0]).fitExtent([[4, 4], [W - 4, H - 4]], frame);
  const path = d3.geoPath(proj);
  const svg = d3.select("#map").append("svg").attr("width", OUT).attr("height", Math.round(OUT * H / W)).attr("viewBox", [0, 0, W, H]);
  const g = svg.append("g");
  g.append("rect").attr("width", W).attr("height", H).attr("fill", T.surface);
  g.append("g").selectAll("path").data(tg.features).join("path").attr("d", path)
    .attr("fill", (f) => shade(val(f.id)))
    .attr("stroke", (f) => (bandOf(val(f.id)) ? d3.hsl(shade(val(f.id))).brighter(0.35).formatHex() : BASE_LINE))
    .attr("stroke-width", 0.3);
  g.append("g").selectAll("path").data(counties).join("path").attr("d", path)
    .attr("fill", "none").attr("stroke", T.muted).attr("stroke-width", 0.75);
  g.append("g").selectAll("path").data(roads[TOWN][WEIGHT]).join("path")
    .attr("d", (l) => path({ type: "LineString", coordinates: l })).attr("fill", "none")
    .attr("stroke", TRANSIT).attr("stroke-width", 1.3).attr("stroke-linecap", "round").attr("stroke-linejoin", "round");
  g.append("path").datum(geo.dma).attr("d", path).attr("fill", "none").attr("stroke", T.ink)
    .attr("stroke-width", 1.05).attr("stroke-dasharray", "3.4 2");
  g.append("path").datum(counties.find((f) => f.id === HOME)).attr("d", path).attr("fill", "none")
    .attr("stroke", T.ink).attr("stroke-width", 1.4);

  // TOWN NAMES IN PLAIN INK, never haloed: a dot at the town and its name beside it, on the side with room
  const placed = [];
  const clear = (b) => b[0] >= 2 && b[1] >= 2 && b[2] <= W - 2 && b[3] <= H - 2
    && !placed.some((o) => b[0] < o[2] + 1 && b[2] > o[0] - 1 && b[1] < o[3] + 1 && b[3] > o[1] - 1);
  for (const l of data.labels) {
    const [x, y] = proj([l.lon, l.lat]);
    const size = l.name === TOWN ? 8 : 6.8, weight = l.name === TOWN ? 700 : 500;
    const t = g.append("text").attr("font-size", size).attr("font-weight", weight).attr("fill", T.ink).text(l.name);
    const w = t.node().getBBox().width;
    const opts = [[x + 3, y + size * 0.35, "start"], [x - 3, y + size * 0.35, "end"], [x, y - 3, "middle"], [x, y + size + 2, "middle"]];
    const pick = opts.map(([tx, ty, an]) => ({ tx, ty, an, b: [an === "end" ? tx - w : an === "middle" ? tx - w / 2 : tx, ty - size, 0, ty + 2] }))
      .map((o) => ({ ...o, b: [o.b[0], o.b[1], o.b[0] + w, o.b[3]] })).find((o) => clear(o.b));
    if (!pick) { t.remove(); continue; }
    placed.push(pick.b, [x - 1.5, y - 1.5, x + 1.5, y + 1.5]);
    t.attr("x", pick.tx).attr("y", pick.ty).attr("text-anchor", pick.an);
    g.append("circle").attr("cx", x).attr("cy", y).attr("r", 1.2).attr("fill", T.ink).attr("stroke", T.surface).attr("stroke-width", 0.4);
  }
  document.body.dataset.height = Math.ceil(document.querySelector("figure").getBoundingClientRect().height);
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
