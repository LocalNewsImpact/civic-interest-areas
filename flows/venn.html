<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two media markets</title>
<link rel="stylesheet" href="https://data.localnewsimpact.org/static/css/tokens.1e94ec252665.css">
<link rel="stylesheet" href="https://data.localnewsimpact.org/static/css/datadesk.eaee6c6d0bbd.css">
<style>
  body { margin: 0; background: var(--bg, #f4f5f7); }
  .wrap { max-width: 64rem; margin: 24px auto; padding: 0 16px; }
  .figure { background: var(--surface, #fff); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px 18px; }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 22px; margin-top: 20px; }
  .panel h3 { font-size: var(--fs-sm); margin: 0; letter-spacing: .04em; text-transform: uppercase;
    color: var(--text-3); font-weight: 600; }
  .panel p { font-size: var(--fs-sm); color: var(--text-2); margin: 8px 0 0; line-height: 1.45; }
  .panel p b { color: var(--ink); font-weight: 600; }
  svg { display: block; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap"><div class="figure">
<figure class="dd-visual">
  <h2 class="dd-title">One county, two media markets</h2>
  <p class="dd-subtitle">A county's residents are not one audience. On an average day a measurable part of the county is in a
    neighbouring county, inside a second set of newsrooms. Each circle is a county's residents, all three panels drawn to one
    scale; the overlap is the home county's residents who are next door.</p>
  <div class="panels" id="panels"></div>
  <figcaption class="dd-footer">
    <span class="dd-source">Counts are from GeoDS Lab county-to-county mobility flows built on SafeGraph phone data, daily files for
      March 2021 (Kang et al., <i>Scientific Data</i>, 2020): devices with an inferred home in one county observed stopping in
      another that day, scaled by the dataset's authors to the resident population and averaged over the 31 days. A resident
      counted next door is usually counted at home the same day, which is what an overlap, rather than a split, represents.
      Population: American Community Survey 2020&ndash;2024 five-year estimates.</span>
  </figcaption>
</figure>
</div></div>
<script src="d3.min.js"></script>
<script>
// Each panel: a county's residents, the neighbour most of its travel goes to, and `both` -- the residents of
// the home county present in that neighbour on an average day in March 2021. `both` is a headcount on the
// same scale as the two populations, so the lens and the circles carry one unit. An earlier draft used each
// county's share of all presence records instead; that denominator counts a resident once per county entered
// per day and runs 2.2-2.5x the population, so it is neither people nor hours and cannot size a lens.
const PAIRS = [
  { home: "Audrain", hp: 24548, away: "Boone", ap: 188043, both: 5701,
    verdict: "Nearly a quarter of the county is inside Boone's market on any given day." },
  { home: "Boone", hp: 188043, away: "Cole", ap: 77032, both: 7104,
    verdict: "Boone is close to a single market: its residents stay in it." },
  { home: "Osage", hp: 13402, away: "Cole", ap: 77032, both: 7102,
    verdict: "More than half the county sets foot in Cole on a given day." },
];
const C = { home: "#0d366b", away: "#3880a1", ink: "#0b0b0b", mute: "#4a5260" };
// one area scale across the three panels, so a circle means the same number of people everywhere. The cap is
// set from the widest pair -- Boone and Cole, which barely overlap and so sit almost end to end -- not from
// the largest circle, or that pair runs out of its panel.
const RMAX = 74;
const k = RMAX / Math.sqrt(188043 / Math.PI);
const rad = (n) => k * Math.sqrt(n / Math.PI);
const LABEL = 13, PAD_TOP = LABEL + 12, PAD_BOT = 24;
const W = 296, H = PAD_TOP + 2 * RMAX + PAD_BOT;

// the distance between two circles whose lens has a given area -- solved rather than guessed, because a Venn
// drawn by eye states an overlap the data does not
function separation(r1, r2, target) {
  const lens = (d) => {
    if (d >= r1 + r2) return 0;
    if (d <= Math.abs(r1 - r2)) return Math.PI * Math.min(r1, r2) ** 2;
    const a = Math.acos((d * d + r1 * r1 - r2 * r2) / (2 * d * r1));
    const b = Math.acos((d * d + r2 * r2 - r1 * r1) / (2 * d * r2));
    return r1 * r1 * (a - Math.sin(2 * a) / 2) + r2 * r2 * (b - Math.sin(2 * b) / 2);
  };
  let lo = Math.abs(r1 - r2), hi = r1 + r2;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (lens(m) > target) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

const panels = d3.select("#panels");
for (const p of PAIRS) {
  const div = panels.append("div").attr("class", "panel");
  div.append("h3").text(p.home + " County");
  const svg = div.append("svg").attr("width", W).attr("height", H).attr("viewBox", [0, 0, W, H]);
  const r1 = rad(p.hp), r2 = rad(p.ap);
  const dd = separation(r1, r2, k * k * p.both);
  const cy = PAD_TOP + RMAX;
  const g = svg.append("g");
  // the home name goes to the left of the home circle, so it can never cross the neighbour's. The pair is
  // pushed right far enough to make room for it, and no further than keeps the neighbour inside the panel --
  // measured from the rendered text, not assumed from its length.
  const probe = g.append("text").attr("font-size", LABEL).attr("font-weight", 600).text(p.home);
  const nameW = probe.node().getComputedTextLength();
  probe.remove();
  const cx = Math.min(Math.max(nameW + r1 + 8, (W - (r1 + dd + r2)) / 2 + r1), W - 4 - dd - r2);
  g.append("circle").attr("cx", cx + dd).attr("cy", cy).attr("r", r2)
    .attr("fill", C.away).attr("fill-opacity", 0.4).attr("stroke", C.away).attr("stroke-width", 1);
  g.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r1)
    .attr("fill", C.home).attr("fill-opacity", 0.55).attr("stroke", C.home).attr("stroke-width", 1);

  // the home name sits clear of its circle on the left with a leader to it; the neighbour's is centred over
  // its own circle. Osage's name is wider than Osage's circle, so anything centred on it lands on Cole.
  const hy = cy - r1 * 0.6;
  g.append("text").attr("x", cx - r1 - 8).attr("y", hy + LABEL * 0.35).attr("text-anchor", "end")
    .attr("font-size", LABEL).attr("font-weight", 600).attr("fill", C.home).text(p.home);
  g.append("line").attr("x1", cx - r1 - 6).attr("y1", hy)
    .attr("x2", cx - Math.sqrt(Math.max(r1 * r1 - (r1 * 0.6) ** 2, 0))).attr("y2", hy)
    .attr("stroke", C.home).attr("stroke-width", 1);
  g.append("text").attr("x", cx + dd).attr("y", cy - r2 - 8).attr("text-anchor", "middle")
    .attr("font-size", LABEL).attr("font-weight", 600).attr("fill", C.away).text(p.away);

  // the lens carries its own percentage on a tick below it: the lens is narrow in two of the three panels,
  // and a number set inside it would be unreadable there
  const xi = (dd * dd + r1 * r1 - r2 * r2) / (2 * dd);
  const lx = cx + (r1 + dd - r2) / 2, ly = cy + Math.sqrt(Math.max(r1 * r1 - xi * xi, 0));
  g.append("line").attr("x1", lx).attr("y1", ly).attr("x2", lx).attr("y2", cy + RMAX + 4)
    .attr("stroke", C.ink).attr("stroke-width", 1);
  g.append("text").attr("x", lx).attr("y", cy + RMAX + 18).attr("text-anchor", "middle")
    .attr("font-size", LABEL).attr("font-weight", 600).attr("fill", C.ink)
    .text((100 * p.both / p.hp).toFixed(1) + "%");

  div.append("p").html(
    `On an average day in March, <b>${p.both.toLocaleString()}</b> of ${p.home}'s ${p.hp.toLocaleString()} residents ` +
    `&mdash; <b>${(100 * p.both / p.hp).toFixed(1)}%</b> &mdash; are in ${p.away} County, in two markets at once. ` +
    p.verdict);
}
document.body.dataset.ready = "1";
</script>
</body>
</html>
